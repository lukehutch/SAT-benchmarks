<text x="212" y="134" font-size="9.8" font-weight="700" fill="#1d4ed8">Satellite Gadget i = 0 (critical witness)</text>
<text x="212" y="148" font-size="8.7" fill="#475569">Local 10-bit vars:  xᵢ ∈ [20, 63],  yᵢ ∈ [0, 40]</text>
