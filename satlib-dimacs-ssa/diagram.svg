    <text x="50" y="373" font-size="11.2" font-weight="700" fill="#047857">SAT ⇒ Detectable Fault (Test Pattern)</text>
    <text x="50" y="391" font-size="9.6" fill="#334155">• Satisfying model x* activates s-a-0/1</text>
    <text x="50" y="407" font-size="9.6" fill="#334155">  and propagates D/D̄ to a primary output</text>
    <text x="50" y="423" font-size="9.6" fill="#334155">• Used in chip silicon manufacturing test</text>
    <text x="50" y="440" font-size="9.4" font-weight="700" fill="#047857">4 SAT instances: ssa7552-{038,158,159,160}</text>
    <rect x="310" y="354" width="262" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="322" y="373" font-size="11.2" font-weight="700" fill="#b91c1c">UNSAT ⇒ Redundant / Untestable Fault</text>
    <text x="322" y="391" font-size="9.6" fill="#334155">• No vector x can simultaneously justify</text>
    <text x="322" y="407" font-size="9.6" fill="#334155">  and sensitize wire w to any output y<tspan baseline-shift="sub" font-size="72%">j</tspan></text>
    <text x="322" y="423" font-size="9.6" fill="#334155">• Enables redundancy removal in synthesis</text>
    <text x="322" y="440" font-size="9.4" font-weight="700" fill="#b91c1c">4 UNSAT: c432, c2670 (×2), c6288 (16×16)</text>
