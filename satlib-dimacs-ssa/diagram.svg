    <text x="686" y="387.0" font-size="9.2" fill="#334155">Duplicates only gates reachable from wire w</text>
    <text x="616" y="402.8" font-size="9.4" font-weight="700" fill="#1d4ed8">Active Flag:</text>
    <text x="686" y="402.8" font-size="9.2" fill="#334155">a<tspan baseline-shift="sub" font-size="72%">g</tspan> ⇒ (g ≠ g<tspan baseline-shift="super" font-size="72%">f</tspan>) ∧ ⋁<tspan baseline-shift="sub" font-size="72%">h∈out(g)</tspan> a<tspan baseline-shift="sub" font-size="72%">h</tspan></text>
