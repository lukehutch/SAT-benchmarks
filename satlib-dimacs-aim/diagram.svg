<text x="50" y="355" font-size="11.5" font-weight="700" fill="#0f172a">How Iwama–Miyano–Asahiro Plant Unique SAT &amp; Low-α UNSAT</text>
<text x="50" y="372" font-size="10" fill="#334155">• <tspan font-weight="700" fill="#059669">yes1 (48 SAT):</tspan> Pick a unique target assignment σ*, iteratively add 3-clauses eliminating</text>
<text x="60" y="386" font-size="10" fill="#334155">all other models until |Sol(F)| = 1 with ultra-uniform variable degrees (Deg CV ≈ 0.03!).</text>
<text x="50" y="403" font-size="10" fill="#334155">• <tspan font-weight="700" fill="#dc2626">no (24 UNSAT):</tspan> Plant a hidden contradictory core at α = 1.6–2.0 (ρ_crit = 0.37–0.47×)</text>
<text x="60" y="417" font-size="10" fill="#334155">so local search stalls while CDCL learns the sparse contradiction in 1–5 ms.</text>
