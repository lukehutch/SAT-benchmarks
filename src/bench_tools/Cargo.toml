[package]
name = "sat-bench-tools"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency accelerator for SAT-benchmarks/src/{to_anf.py,analyze_benchmarks.py}"
license = "MIT"
publish = false

[[bin]]
name = "sat-bench-tools"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
debug = false

# Standalone crate: never get absorbed into an enclosing workspace.
[workspace]
