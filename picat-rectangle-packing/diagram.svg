    <text x="514" y="121.5" font-size="9.0" font-weight="700" fill="#1e3a8a">2D non-overlap: diffn([[Xᵢ, Yᵢ, i, i] : i ∈ 1..n])</text>
    <text x="514" y="133" font-size="8.2" fill="#475569">Disjunctive separation Xᵢ+i≤Xⱼ ∨ Xⱼ+j≤Xᵢ ∨ Yᵢ+i≤Yⱼ ∨ Yⱼ+j≤Yᵢ</text>
