<text x="626" y="215" font-size="8.7" fill="#334155">181 bins / S-box = 90,500 redundant propagators</text>
<text x="618" y="238" font-size="9" font-weight="600" fill="#0f172a">Total XCNF: 123,012 CNF + 42,812 XOR = 165,824 cls</text>
<text x="618" y="251" font-size="8.7" fill="#475569">Max depth 215 · AND-depth 84 · 1 connected component</text>
