  <text x="40" y="433" class="body">Remaining squares: 32 Dark ≠ 30 Light → 2 Dark unmatched!</text>
  <text x="40" y="452" class="body">Suite scales to chessboard12, 16, 32 (hard for CDCL; 2 ms for card/GA).</text>
