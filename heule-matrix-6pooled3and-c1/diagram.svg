    <text x="876" y="159" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.0" font-weight="700" fill="#059669">−20.8%</text>
    <text x="504" y="183" font-size="9.5" font-weight="600" fill="#334155">Clauses m</text>
    <rect x="594" y="173" width="118.4" height="7" rx="2" fill="#cbd5e1"/>
    <rect x="594" y="182" width="188.7" height="8" rx="2" fill="#d97706"/>
    <text x="876" y="185" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.0" font-weight="700" fill="#d97706">+59.3%</text>
    <text x="504" y="209" font-size="9.5" font-weight="600" fill="#334155">Native XORs</text>
    <rect x="594" y="199" width="192.0" height="7" rx="2" fill="#cbd5e1"/>
    <rect x="594" y="208" width="104.7" height="8" rx="2" fill="#2563eb"/>
    <text x="876" y="211" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.0" font-weight="700" fill="#2563eb">−45.5%</text>
    <text x="504" y="235" font-size="9.5" font-weight="600" fill="#334155">Deg CV (skew)</text>
    <rect x="594" y="225" width="184.3" height="7" rx="2" fill="#cbd5e1"/>
    <rect x="594" y="234" width="101.8" height="8" rx="2" fill="#7c3aed"/>
    <text x="876" y="237" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.0" font-weight="700" fill="#7c3aed">0.96 → 0.53</text>
