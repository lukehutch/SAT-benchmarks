    <rect x="609.5" y="287" width="33.2" height="19" fill="#059669" stroke="#ffffff" stroke-width="0.8"/>
    <text x="626.1" y="300" text-anchor="middle" font-size="8.4" font-weight="700" fill="#ffffff">4-cl</text>
