  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="26" y="34" font-size="17.5" font-weight="700" fill="#0f172a">Heule 3×3 Matrix Multiplication — 6pooled3and / Challenge 3 (MM-23-63-no-type3)</text>
    <text x="26" y="53" font-size="11.5" fill="#475569">Direct 3-AND + 6-pooled XOR re-encoding of the R = 23 no-type-3-in-M₁ challenge (21,033 vars, 186,651 clauses, 4,374 XORs)</text>
    <rect x="760" y="18" width="136" height="26" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
