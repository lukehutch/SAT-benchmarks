    <text x="244.0" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1. How no-type3 Eliminates M₁ Inside Direct 3-AND + 6-XOR</text>
    <rect x="36" y="116" width="416" height="74" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="46" y="134" font-size="10.8" font-weight="700" fill="#b91c1c">Constraint on Summand M₁: 27 Forbidden Type-3 Triples (δ = 1)</text>
    <text x="46" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.2" font-weight="700" fill="#1e293b">(¬a⁽¹⁾ᵢₖ ∨ ¬b⁽¹⁾ₖⱼ ∨ ¬c⁽¹⁾ⱼᵢ)   for all 27 trace triples (i,j,k)</text>
    <text x="46" y="172" font-size="9.5" fill="#475569">In plain CNF, these sit 2 gates away from XORs (via pair p = a∧b, then s = p∧c).</text>
    <line x1="244.0" y1="190" x2="244.0" y2="207" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrr)"/>
    <rect x="36" y="210" width="416" height="86" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="46" y="228" font-size="10.8" font-weight="700" fill="#1d4ed8">Direct 3-AND Resolution Shortcut (Zero Pair Variables!):</text>
    <text x="46" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.7" fill="#334155">3-AND: (¬s₁∨a₁), (¬s₁∨b₁), (¬s₁∨c₁), (s₁∨¬a₁∨¬b₁∨¬c₁)</text>
    <text x="46" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.9" font-weight="700" fill="#b91c1c">Resolve with (¬a₁ ∨ ¬b₁ ∨ ¬c₁) ⇒ Unit (¬s₁)  [s⁽¹⁾ = 0 on δ=1]</text>
    <text x="46" y="282" font-size="9.4" fill="#475569">1-step binary/ternary resolution kills all 27 δ = 1 cubes of M₁ directly.</text>
    <line x1="244.0" y1="296" x2="244.0" y2="313" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="36" y="316" width="416" height="128" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="46" y="334" font-size="10.8" font-weight="700" fill="#6d28d9">Impact on the 27 δ = 1 Pooled 6-XOR Trees (M₂…M₂₃ Only):</text>
    <rect x="46" y="344" width="194" height="44" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="143" y="360" text-anchor="middle" font-size="9.4" font-weight="700" fill="#6d28d9">Leaf Pool 1 (δ = 1 eqs)</text>
    <text x="143" y="377" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.3" fill="#1e293b"><tspan fill="#dc2626" text-decoration="line-through">s₁</tspan> ⊕ s₂ ⊕ s₃ ⊕ s₄ ⊕ s₅ ⊕ t₁ = 1</text>
    <line x1="242" y1="366" x2="266" y2="366" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="270" y="344" width="168" height="44" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="354" y="360" text-anchor="middle" font-size="9.4" font-weight="700" fill="#b45309">Pools 2–5 + 3-XOR Root</text>
    <text x="354" y="377" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.1" fill="#1e293b">s₆…s₂₃ via t₂…t₅ (5 aux)</text>
    <text x="46" y="407" font-size="9.5" fill="#334155">• On the 27 δ = 1 equations: Leaf Pool 1 shrinks effectively to a 5-XOR over M₂…M₅.</text>
    <text x="46" y="423" font-size="9.5" fill="#334155">• On the 702 δ = 0 equations: M₁ stays fully active to cancel cross-terms mod 2.</text>
    <text x="46" y="437" font-size="9.2" font-weight="600" fill="#6d28d9">• Equivalent to Challenge 3, with 5,508 fewer variables and tighter clause locality.</text>
