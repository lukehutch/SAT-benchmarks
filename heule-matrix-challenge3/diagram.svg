    <text x="46" y="384" font-size="10.5" font-weight="700" fill="#0f172a">Why This Question Matters for Algebraic Complexity:</text>
    <text x="46" y="401" font-size="9.6" fill="#334155">• Every known R = 23 scheme in the SAT 2019 corpus had ≥1 type-3 term per layer.</text>
    <text x="46" y="416" font-size="9.6" fill="#334155">• Zero hardcoded pairings &amp; zero streamlining: preserves full S₂₂ × GL₃ symmetry.</text>
    <text x="46" y="431" font-size="9.6" fill="#334155">• A SAT model reveals a 22-layer type-3 cover aided by 1 pure-cancellation layer.</text>
