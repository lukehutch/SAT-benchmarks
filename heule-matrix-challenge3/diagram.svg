    <text x="239.0" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1. Asymmetric Split: 1 Type-3-Free Layer + 22 Cover Layers</text>
    <rect x="36" y="116" width="406" height="122" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="46" y="135" font-size="11.2" font-weight="700" fill="#b91c1c">Restricted Summand M₁ = u⁽¹⁾ ⊗ v⁽¹⁾ ⊗ w⁽¹⁾  (Vars 1..27)</text>
    <text x="46" y="152" font-size="10" fill="#334155">27 ternary clauses forbid EVERY trace triple (aᵢₖ, bₖⱼ, cⱼᵢ) simultaneously:</text>
    <rect x="46" y="160" width="386" height="34" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="239.0" y="181" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#b91c1c">∀ i,j,k:  (¬a⁽¹⁾ᵢₖ ∨ ¬b⁽¹⁾ₖⱼ ∨ ¬c⁽¹⁾ⱼᵢ)  ⇒  s⁽¹⁾ = 0  (on δ = 1)</text>
    <text x="46" y="211" font-size="9.8" fill="#475569">Role of M₁: Pure cancellation helper! Can ONLY flip parity in the 702</text>
    <text x="46" y="226" font-size="9.8" fill="#475569">off-tensor (δ = 0) Brent equations; contributes 0 to all 27 target δ = 1 terms.</text>
