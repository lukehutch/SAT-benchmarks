<text x="722" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#1d4ed8">tᵢ₋₁ ⊕ tᵢ ⊕ sᵢ = δᵢ,₀</text>
<text x="722" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#047857">bᵢ₋₁ ⊕ bᵢ ⊕ sᵢ = 0</text>
<text x="722" y="199" font-size="9" fill="#475569">• 400 vertices, 600 edges</text>
<text x="722" y="213" font-size="9" fill="#475569">• 1,000 CNF vars, 3,600 cls</text>
<rect x="712" y="240" width="170" height="114" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.1"/>
<text x="722" y="258" font-size="10.1" font-weight="700" fill="#047857">Low Treewidth Control</text>
<text x="722" y="274" font-size="9" fill="#1e293b">• Same UNSAT parity law</text>
<text x="722" y="289" font-size="9" fill="#1e293b">• Bounded treewidth ≤ 4</text>
<text x="722" y="304" font-size="9" fill="#1e293b">• CaDiCaL: 9.6 ms</text>
<text x="722" y="319" font-size="9" fill="#1e293b">• Kissat: 13.6 ms</text>
<text x="722" y="334" font-size="9" font-weight="700" fill="#047857">• Proves expansion—not size</text>
<text x="730" y="347" font-size="8.6" fill="#475569">—causes the CDCL cliff!</text>
<rect x="24" y="382" width="872" height="82" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.25"/>
