<text x="278" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" font-weight="700" fill="#1d4ed8">xₑ₁ ⊕ xₑ₂ ⊕ xₑ₃ = σ(v)</text>
<text x="278" y="181" font-size="9" fill="#475569">• 4 ternary CNF clauses / v</text>
<text x="278" y="196" font-size="9" fill="#475569">• σ(v₀) = 1, σ(v&gt;0) = 0</text>
<text x="278" y="211" font-size="9" fill="#475569">• Every edge in 2 XOR eqs</text>
<rect x="268" y="240" width="170" height="114" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/>
<text x="278" y="258" font-size="10.1" font-weight="700" fill="#b91c1c">High Expansion = Hard</text>
<text x="278" y="274" font-size="9" fill="#1e293b">• Treewidth tw = Ω(n)</text>
<text x="278" y="289" font-size="9" fill="#1e293b">• Resolution size 2^Ω(n)</text>
<text x="278" y="304" font-size="9" fill="#1e293b">• n=120, 300: Kissat &amp;</text>
<text x="286" y="317" font-size="9" font-weight="700" fill="#b91c1c">CaDiCaL &gt;5,000 s (T/O)</text>
<text x="278" y="334" font-size="9" font-weight="700" fill="#047857">• 𝔽₂-Gauss: 1.2–1.4 ms</text>
<text x="278" y="347" font-size="8.4" fill="#475569">LRAT verified in cake_lpr</text>
