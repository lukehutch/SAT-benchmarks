<text x="508" y="393" font-size="11" font-weight="700" fill="#92400e">Why uuf250-1065 Dominates Runtime</text>
<text x="508" y="408" font-size="10" fill="#78350f">UNSAT proofs scale as ~2^(c·n): uuf50 takes ~2 ms while uuf250 takes</text>
<text x="508" y="420" font-size="10" fill="#78350f">~1.9–3.6 s (nearly 1,000× harder) across all 5 modern CDCL solvers.</text>
