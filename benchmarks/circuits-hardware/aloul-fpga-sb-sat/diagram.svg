    <text x="449" y="430.5" font-size="9.8" font-weight="600" fill="#334155">t₅ Spare</text>
    <rect x="554" y="78" width="342" height="122" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="568" y="99" font-size="12" font-weight="700" fill="#0f172a">CNF Encoding (fpga10_8_sat_rcr Example)</text>
    <text x="568" y="119.0" font-size="10" font-weight="700" fill="#1d4ed8">Variables:</text>
    <text x="638" y="119.0" font-size="9.8" fill="#334155">x<tspan baseline-shift="sub" font-size="72%">i,t</tspan> = 1 iff net i assigned to track t (120 vars)</text>
    <text x="568" y="135.5" font-size="10" font-weight="700" fill="#1d4ed8">ALO (8 cls):</text>
    <text x="638" y="135.5" font-size="9.8" fill="#334155">⋁<tspan baseline-shift="sub" font-size="72%">t=1..W</tspan> x<tspan baseline-shift="sub" font-size="72%">i,t</tspan>  (each net gets ≥ 1 track, len W)</text>
    <text x="568" y="152.0" font-size="10" font-weight="700" fill="#1d4ed8">SB Coupling:</text>
    <text x="638" y="152.0" font-size="9.8" fill="#334155">80 mixed 5-clauses (pass-transistor fan-out rules)</text>
    <text x="568" y="168.5" font-size="10" font-weight="700" fill="#1d4ed8">Track AMO:</text>
    <text x="638" y="168.5" font-size="9.8" fill="#334155">360 binary clauses ¬x<tspan baseline-shift="sub" font-size="72%">i,t</tspan> ∨ ¬x<tspan baseline-shift="sub" font-size="72%">j,t</tspan> (disjoint)</text>
    <text x="568" y="185.0" font-size="10" font-weight="700" fill="#1d4ed8">Randomize:</text>
    <text x="638" y="185.0" font-size="9.8" fill="#334155">Variables &amp; clauses randomly reordered (_rcr)</text>
    <rect x="554" y="212" width="342" height="96" rx="9" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="568" y="232" font-size="12" font-weight="700" fill="#6d28d9">Permutation Symmetry Group (S<tspan baseline-shift="sub" font-size="72%">N</tspan> × S<tspan baseline-shift="sub" font-size="72%">W</tspan>)</text>
    <text x="568" y="250" font-size="10" fill="#334155">• Track indices t₁..t<tspan baseline-shift="sub" font-size="72%">W</tspan> are fully interchangeable (S<tspan baseline-shift="sub" font-size="72%">W</tspan>)</text>
    <text x="568" y="266" font-size="10" fill="#334155">• Identical net demands permute freely in channels (S<tspan baseline-shift="sub" font-size="72%">N</tspan>)</text>
    <text x="568" y="282" font-size="10" fill="#334155">• Unlike Homer UNSAT, N ≤ W guarantees many valid</text>
    <text x="576" y="297" font-size="10" fill="#334155">track assignments (solved in ~1.6–2.4 ms on 1 core)</text>
    <rect x="554" y="320" width="342" height="128" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="568" y="340" font-size="12" font-weight="700" fill="#0f172a">Corpus Profile (11 Instances · 0 XORs)</text>
