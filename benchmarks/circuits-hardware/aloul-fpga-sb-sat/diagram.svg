    <text x="28" y="53" font-size="11.8" fill="#475569">4-sided programmable switch-box channels with N ≤ W tracks per side · 11 satisfiable instances (fpga10_8 .. fpga13_12) with S<tspan baseline-shift="sub" font-size="72%">N</tspan> × S<tspan baseline-shift="sub" font-size="72%">W</tspan> symmetry</text>
