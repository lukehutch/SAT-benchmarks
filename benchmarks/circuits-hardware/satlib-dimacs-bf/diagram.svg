    <text x="618" y="349.0" font-size="9.5" font-weight="700" fill="#1d4ed8">Clause Width:</text>
    <text x="696" y="349.0" font-size="9.4" fill="#334155">k̄ = 2.33–2.61 (k<tspan baseline-shift="sub" font-size="72%">max</tspan> = 5–6)</text>
    <text x="618" y="366.5" font-size="9.5" font-weight="700" fill="#1d4ed8">Binary / Horn:</text>
    <text x="696" y="366.5" font-size="9.4" fill="#334155">49–73% binary · 72–75% Horn</text>
    <text x="618" y="384.0" font-size="9.5" font-weight="700" fill="#1d4ed8">Phase Regime:</text>
    <text x="696" y="384.0" font-size="9.4" fill="#334155">Over (ρ<tspan baseline-shift="sub" font-size="72%">crit</tspan> = 1.94×–2.11×, κ = 0.96)</text>
    <text x="618" y="401.5" font-size="9.5" font-weight="700" fill="#1d4ed8">Degree Skew:</text>
    <text x="696" y="401.5" font-size="9.4" fill="#334155">Deg CV = 0.47–0.77 (moderate fan-out)</text>
    <text x="618" y="419.0" font-size="9.5" font-weight="700" fill="#1d4ed8">Native XORs:</text>
    <text x="696" y="419.0" font-size="9.4" fill="#334155">28 extracted total (c432 + c2670)</text>
    <text x="618" y="436.5" font-size="9.5" font-weight="700" fill="#1d4ed8">CDCL Speed:</text>
    <text x="696" y="436.5" font-size="9.4" fill="#334155">All 4 closed in 5–29 ms on 1 core</text>
