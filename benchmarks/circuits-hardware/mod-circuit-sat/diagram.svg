    <rect x="38" y="430" width="498" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="50" y="445" font-size="9.5" font-weight="700" fill="#0f172a">Symmetric Hamming-Weight Verification (n = 3, m = 3):</text>
    <text x="50" y="459" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.1" fill="#334155">wt(x) ∈ {0,1,2,3}  →  MOD₃<tspan baseline-shift="super" font-size="72%">3,0</tspan>: [1, 0, 0, 1] (s*=3)   ·   MOD₃<tspan baseline-shift="super" font-size="72%">3,1</tspan>: [0, 1, 0, 0] (s*=4)</text>
    <rect x="566" y="78" width="330" height="244" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
