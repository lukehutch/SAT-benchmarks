    <text x="650" y="423.5" font-size="9.5" fill="#334155">lex gate order + noreuse + symmetric inputs</text>
    <text x="580" y="440.0" font-size="9.6" font-weight="700" fill="#6d28d9">Regime:</text>
    <text x="650" y="440.0" font-size="9.5" fill="#334155">Deep Over (ρ<tspan baseline-shift="sub" font-size="72%">crit</tspan> = 3.24×–14.2×, α up to 80)</text>
