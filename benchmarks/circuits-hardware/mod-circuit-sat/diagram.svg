  </defs>
  <rect x="2" y="2" width="916" height="491" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="28" y="34" font-size="17.5" font-weight="700" fill="#0f172a">Exact Synthesis of Optimal MOD<tspan baseline-shift="sub" font-size="72%">n</tspan><tspan baseline-shift="super" font-size="72%">3,r</tspan> Circuits (mod-circuit-sat)</text>
    <text x="28" y="53" font-size="11.8" fill="#475569">Minimum 2-input B₂ gate DAGs computing [(x₁ + … + x<tspan baseline-shift="sub" font-size="72%">n</tspan>) mod 3 = r] · Sharp s* − 1 (UNSAT) vs s* (SAT) thresholds</text>
    <rect x="734" y="18" width="160" height="24" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="814" y="34" text-anchor="middle" font-size="10.8" font-weight="700" fill="#1d4ed8">5 SAT · 4 UNSAT · 2 Open</text>
    <line x1="24" y1="65" x2="896" y2="65" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="24" y="78" width="526" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="40" y="100" font-size="13" font-weight="700" fill="#0f172a">Verified Exact Minimum B₂ Circuits (Decoded from SAT Models)</text>
    <text x="40" y="116" font-size="10.4" fill="#475569">Normal 2-input basis B₂ = {AND, OR, XOR, GT (a∧¬b), LT (¬a∧b)} with g(0,0) = 0</text>
