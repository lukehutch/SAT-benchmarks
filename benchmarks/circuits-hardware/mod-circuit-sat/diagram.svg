    <text x="50" y="147" font-size="11.5" font-weight="700" fill="#047857">A. MOD₃<tspan baseline-shift="super" font-size="72%">3,0</tspan>(x₁, x₂, x₃) — Optimal s* = 3 Gates (mod3_n3_r0_s3_sat)</text>
