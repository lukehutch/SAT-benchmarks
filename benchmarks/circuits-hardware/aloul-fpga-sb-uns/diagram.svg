    <text x="568" y="152.0" font-size="9.8" fill="#334155">• Cardinality / Symmetry-aware solvers: 10/10 in 16–23 ms</text>
    <text x="568" y="168.5" font-size="9.8" fill="#334155">• Symmetry group Aut(F) contains S<tspan baseline-shift="sub" font-size="72%">N</tspan> × S<tspan baseline-shift="sub" font-size="72%">W</tspan> × Z₂</text>
    <text x="568" y="185.0" font-size="9.8" fill="#334155">• Random variable/clause shuffling (_rcr) hides block order</text>
