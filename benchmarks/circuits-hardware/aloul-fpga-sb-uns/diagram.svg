    <text x="230" y="340.0" font-size="9.6" font-weight="700" fill="#b91c1c">ALO (2N clauses):</text>
    <text x="326" y="340.0" font-size="9.4" fill="#334155">⋁<tspan baseline-shift="sub" font-size="72%">t=1..W</tspan> x<tspan baseline-shift="sub" font-size="72%">s,i,t</tspan>  (s ∈ {L, R}, len W)</text>
    <text x="230" y="358.5" font-size="9.6" font-weight="700" fill="#b91c1c">AMO (2W·C(N,2)):</text>
    <text x="326" y="358.5" font-size="9.4" fill="#334155">¬x<tspan baseline-shift="sub" font-size="72%">s,i,t</tspan> ∨ ¬x<tspan baseline-shift="sub" font-size="72%">s,j,t</tspan>  (100% binary)</text>
    <text x="230" y="377.0" font-size="9.6" font-weight="700" fill="#b91c1c">Degree Profile:</text>
    <text x="326" y="377.0" font-size="9.4" fill="#334155">Every variable has exact identical degree</text>
    <text x="326" y="395.5" font-size="9.4" font-weight="600" fill="#0f172a">d = 1 + (N − 1) = N  ⇒  Deg CV = 0.00!</text>
    <text x="230" y="414.0" font-size="9.6" font-weight="700" fill="#b91c1c">Proof Complexity:</text>
    <text x="326" y="414.0" font-size="9.4" fill="#334155">Haken (1985): Resolution needs 2<tspan baseline-shift="super" font-size="72%">Ω(W)</tspan></text>
