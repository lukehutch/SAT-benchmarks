  <text x="38" y="338" font-size="11.8" font-weight="700" fill="#0f172a">2. Sequential Comparator-Slot Encoding (sat_challenges.py)</text>
  <line x1="42" y1="366" x2="124" y2="366" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="42" y1="398" x2="124" y2="398" stroke="#94a3b8" stroke-width="1.8"/>
