  <text x="42" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">a</text>
  <text x="42" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#334155">b</text>
  <text x="128" y="369" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" fill="#1d4ed8">lo = a &amp; b</text>
  <text x="128" y="401" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" fill="#1d4ed8">hi = a | b</text>
  <text x="202" y="360" font-size="9.4" fill="#334155">&#x2022; Each slot t in 0..K-1 selects at most one pair (i,j), i &lt; j.</text>
  <text x="202" y="382" font-size="9.4" fill="#334155">&#x2022; AMO(C(N,2)) allows idle slots (upper-bound budget K).</text>
  <text x="202" y="404" font-size="9.4" fill="#334155">&#x2022; Propagates all 2^N - (N+1) unsorted 0/1 input vectors.</text>
  <text x="202" y="426" font-size="9.4" fill="#334155">&#x2022; Untouched wires preserve state via frame clauses.</text>
  <text x="202" y="448" font-size="9.4" fill="#334155">&#x2022; Pure size optimization (contrast parallel depth A067782).</text>
