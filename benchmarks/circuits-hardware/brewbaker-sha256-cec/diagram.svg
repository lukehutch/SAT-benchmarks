<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="FIPS 180-4 SHA-256 Ripple-vs-Prefix Adder CEC Miters (brewbaker-sha256-cec)">
<defs>
  <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
  </marker>
  <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
  </marker>
  <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="2" y="2" width="956" height="516" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="26" y="34" font-size="17.5" font-weight="700" fill="#0f172a">FIPS 180-4 SHA-256 Ripple-vs-Prefix Adder CEC Miters (brewbaker-sha256-cec)</text>
  <text x="26" y="53" font-size="11.6" fill="#475569">Combinational equivalence checking of two independent 32-bit adder architectures across R = 1..64 rounds + "abc" traces (Chad Brewbaker, sat_challenges.py sha256)</text>
  <rect x="742" y="16" width="192" height="24" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="838" y="32" text-anchor="middle" font-size="10.8" font-weight="700" fill="#b91c1c">13 Instances &#x00B7; 2 SAT / 11 UNSAT</text>
  <line x1="24" y1="65" x2="936" y2="65" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="78" width="912" height="214" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="24" y="78" width="912" height="28" rx="10" fill="#1e293b"/>
  <rect x="24" y="94" width="912" height="12" fill="#1e293b"/>
  <text x="38" y="97" font-size="11.6" font-weight="700" fill="#ffffff">1. Combinational Equivalence Checking (CEC) Miter Architecture (sha256 R --bytes B &#x2192; Always UNSAT)</text>
  <rect x="40" y="150" width="136" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
  <text x="108" y="172" text-anchor="middle" font-size="10.4" font-weight="700" fill="#0f172a">Symbolic Input</text>
  <text x="108" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" fill="#1d4ed8">B bytes (8B vars)</text>
  <text x="108" y="206" text-anchor="middle" font-size="8.6" fill="#475569">+ 0x80 || 0..0 || len64</text>
  <text x="108" y="222" text-anchor="middle" font-size="8.6" fill="#475569">512-bit FIPS 180-4 block</text>
  <text x="108" y="235" text-anchor="middle" font-size="8.2" fill="#64748b">Shared primary inputs</text>
  <path d="M 176 182 L 204 182 L 204 156 L 236 156" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-b)"/>
  <path d="M 176 212 L 204 212 L 204 238 L 236 238" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-p)"/>
  <rect x="240" y="120" width="356" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="254" y="139" font-size="11" font-weight="700" fill="#1d4ed8">Circuit A: Ripple-Carry SHA-256 (prefix=False)</text>
  <text x="254" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" fill="#1e293b">c[i+1] = g[i] | (p[i] &amp; c[i])   (depth 31 chain)</text>
  <text x="254" y="173" font-size="8.8" fill="#475569">Msg schedule W[0..R-1] + R rounds (Ch, Maj, &#x03A3;0/&#x03A3;1) + IV feed-forward</text>
  <rect x="240" y="204" width="356" height="68" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="254" y="223" font-size="11" font-weight="700" fill="#6d28d9">Circuit B: Parallel-Prefix SHA-256 (prefix=True)</text>
  <text x="254" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" fill="#1e293b">5-level Kogge-Stone prefix (strides 1, 2, 4, 8, 16)</text>
  <text x="254" y="257" font-size="8.8" fill="#475569">Identical mod-2^32 sum semantics, distinct internal carry-tree topology</text>
  <path d="M 596 156 L 634 156 L 634 186 L 656 186" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr-b)"/>
  <path d="M 596 238 L 634 238 L 634 208 L 656 208" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr-p)"/>
  <rect x="660" y="150" width="114" height="92" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
  <text x="717" y="172" text-anchor="middle" font-size="10.4" font-weight="700" fill="#be123c">256-Bit Miter</text>
  <text x="717" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#9f1239">d[i] = A[i] ^ B[i]</text>
  <text x="717" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#9f1239">OR(d[0..255]) = 1</text>
  <text x="717" y="231" text-anchor="middle" font-size="8.3" fill="#475569">Any digest mismatch</text>
  <line x1="774" y1="196" x2="806" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r)"/>
  <rect x="810" y="160" width="112" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="866" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">UNSAT</text>
  <text x="866" y="202" text-anchor="middle" font-size="8.8" fill="#7f1d1d">Proves A(x) == B(x)</text>
  <text x="866" y="217" text-anchor="middle" font-size="8.4" fill="#7f1d1d">for all 2^(8B) inputs</text>
  <rect x="24" y="304" width="912" height="78" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="38" y="324" font-size="11.4" font-weight="700" fill="#166534">2. Fixed-Message FIPS 180-4 Trace Verification Mode (--message-hex 616263 = "abc", R = 64 Rounds)</text>
  <text x="38" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" fill="#0f172a">SHA-256("abc") = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad   (101,614 vars | 347,923 cls | 43,131 XORs)</text>
  <rect x="38" y="352" width="276" height="22" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.9"/>
  <text x="176" y="367" text-anchor="middle" font-size="8.8" font-weight="700" fill="#166534">trace_r64_abc (unconstrained): SAT (unique witness)</text>
  <rect x="326" y="352" width="288" height="22" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="0.9"/>
  <text x="470" y="367" text-anchor="middle" font-size="8.8" font-weight="700" fill="#166534">trace_r64_abc_expect_ok (...0015ad): SAT (exact match)</text>
  <rect x="626" y="352" width="296" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="0.9"/>
  <text x="774" y="367" text-anchor="middle" font-size="8.8" font-weight="700" fill="#b91c1c">trace_r64_abc_expect_flip (...0015ac, 1-bit flip): UNSAT</text>
  <rect x="24" y="394" width="912" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="414" font-size="11.6" font-weight="700" fill="#0f172a">3. CEC Miter Scaling Ladder Across Rounds R = 1..64 &amp; Native XOR Density (Up to 87,076 XORs, 3.00M AIG ANDs)</text>
  <rect x="38.0" y="426" width="140" height="66" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.1"/>
  <text x="108.0" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#0f766e">R=1, B=4</text>
  <text x="108.0" y="457" text-anchor="middle" font-size="8.4" font-weight="600" fill="#0f172a">2.2K vars | 364 XORs</text>
  <text x="108.0" y="471" text-anchor="middle" font-size="8.1" fill="#334155">18.3 KB .cnf.xz</text>
  <text x="108.0" y="485" text-anchor="middle" font-size="7.9" fill="#475569">Tractable CEC</text>
  <rect x="186.8" y="426" width="140" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="256.8" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#2563eb">R=2, B=2 &amp; 4</text>
  <text x="256.8" y="457" text-anchor="middle" font-size="8.4" font-weight="600" fill="#0f172a">4.7K-6.4K vars</text>
  <text x="256.8" y="471" text-anchor="middle" font-size="8.1" fill="#334155">887-1.3K XORs</text>
  <text x="256.8" y="485" text-anchor="middle" font-size="7.9" fill="#475569">Sharp solver split</text>
  <rect x="335.6" y="426" width="140" height="66" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1"/>
  <text x="405.6" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#4f46e5">R=4, B=1 &amp; 4</text>
  <text x="405.6" y="457" text-anchor="middle" font-size="8.4" font-weight="600" fill="#0f172a">12.5K-15.9K vars</text>
  <text x="405.6" y="471" text-anchor="middle" font-size="8.1" fill="#334155">2.6K-3.3K XORs</text>
  <text x="405.6" y="485" text-anchor="middle" font-size="7.9" fill="#475569">B=1 fast / B=4 hard</text>
  <rect x="484.4" y="426" width="140" height="66" rx="7" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="554.4" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#7c3aed">R=8, B=1 &amp; 4</text>
  <text x="554.4" y="457" text-anchor="middle" font-size="8.4" font-weight="600" fill="#0f172a">30.3K-33.3K vars</text>
  <text x="554.4" y="471" text-anchor="middle" font-size="8.1" fill="#334155">6.4K-7.1K XORs</text>
  <text x="554.4" y="485" text-anchor="middle" font-size="7.9" fill="#475569">B=1 ~1s / B=4 hard</text>
  <rect x="633.2" y="426" width="140" height="66" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="703.2" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#d97706">R=16 &amp; R=32</text>
  <text x="703.2" y="457" text-anchor="middle" font-size="8.4" font-weight="600" fill="#0f172a">68K-154K vars</text>
  <text x="703.2" y="471" text-anchor="middle" font-size="8.1" fill="#334155">14.7K-34.1K XORs</text>
  <text x="703.2" y="485" text-anchor="middle" font-size="7.9" fill="#475569">Deep CEC frontier</text>
  <rect x="782.0" y="426" width="140" height="66" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.1"/>
  <text x="852.0" y="442" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#be123c">R=64, B=4</text>
  <text x="852.0" y="457" text-anchor="middle" font-size="8.4" font-weight="600" fill="#0f172a">373K vars | 1.21M cls</text>
  <text x="852.0" y="471" text-anchor="middle" font-size="8.1" fill="#334155">87,076 native XORs</text>
  <text x="852.0" y="485" text-anchor="middle" font-size="7.9" fill="#475569">Full FIPS 180-4 CEC</text>
</g>
</svg>
