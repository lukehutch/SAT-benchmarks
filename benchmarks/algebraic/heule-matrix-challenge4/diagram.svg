  <rect x="2" y="2" width="916" height="476" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="26" y="34" font-size="17.5" font-weight="700" fill="#0f172a">Heule 3×3 Matrix Multiplication — Challenge 4 (MM-22: Open R = 22 Frontier)</text>
    <text x="26" y="53" font-size="11.5" fill="#475569">Plain unstreamlined Brent-equation CNF over 𝔽₂ testing whether 3×3 matrix multiplication admits a rank-22 bilinear scheme (open since 1976)</text>
    <rect x="744" y="18" width="152" height="26" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
    <text x="820" y="35" text-anchor="middle" font-size="10.8" font-weight="700" fill="#b45309">OPEN FRONTIER (R = 22)</text>
    <line x1="22" y1="64" x2="898" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="22" y="76" width="424" height="384" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="22" y="76" width="424" height="28" rx="9" fill="#0f172a"/>
    <rect x="22" y="92" width="424" height="12" fill="#0f172a"/>
    <text x="234.0" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1. Algebraic Complexity Frontier for rank(T₃,₃,₃) over 𝔽₂</text>
    <rect x="36" y="116" width="396" height="136" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="46" y="135" font-size="10.8" font-weight="700" fill="#0f172a">Number of Rank-1 Multiplications R for 3×3 Matrix Product C = A · B:</text>
    <rect x="46.0" y="150" width="34.6" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
    <text x="63.3" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#b91c1c">18</text>
    <text x="63.3" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#b91c1c">UNSAT</text>
    <rect x="83.6" y="150" width="34.6" height="40" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.0"/>
    <text x="100.9" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#b91c1c">19</text>
    <text x="100.9" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#b91c1c">LB</text>
    <rect x="121.2" y="150" width="34.6" height="40" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
    <text x="138.5" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#64748b">20</text>
    <text x="138.5" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#64748b">?</text>
    <rect x="158.8" y="150" width="34.6" height="40" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
    <text x="176.1" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#64748b">21</text>
    <text x="176.1" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#64748b">?</text>
    <rect x="196.4" y="146" width="34.6" height="48" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
    <text x="213.7" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#b45309">22</text>
    <text x="213.7" y="184" text-anchor="middle" font-size="8.2" font-weight="700" fill="#b45309">MM-22</text>
    <rect x="234.0" y="150" width="34.6" height="40" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.0"/>
    <text x="251.3" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#047857">23</text>
    <text x="251.3" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#047857">SAT</text>
    <rect x="271.6" y="150" width="34.6" height="40" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.0"/>
    <text x="288.9" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#047857">24</text>
    <text x="288.9" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#047857">SAT</text>
    <rect x="309.2" y="150" width="34.6" height="40" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.0"/>
    <text x="326.5" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#047857">25</text>
    <text x="326.5" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#047857">SAT</text>
    <rect x="346.8" y="150" width="34.6" height="40" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.0"/>
    <text x="364.1" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#047857">26</text>
    <text x="364.1" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#047857">SAT</text>
    <rect x="384.4" y="150" width="34.6" height="40" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.0"/>
    <text x="401.7" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1d4ed8">27</text>
    <text x="401.7" y="182" text-anchor="middle" font-size="8.2" font-weight="700" fill="#1d4ed8">3³</text>
    <text x="46" y="214" font-size="9.5" fill="#b91c1c">• R ≤ 18 impossible; R ≥ 19 lower bound (Bläser 2003, all fields)</text>
    <text x="46" y="229" font-size="9.5" font-weight="700" fill="#b45309">• R = 22 (MM-22): Famous open threshold — SAT breaks Laderman's 1976 record!</text>
    <text x="46" y="244" font-size="9.5" fill="#047857">• R = 23: Laderman (1976) &amp; 17,000+ schemes (Heule–Kauers–Seidl SAT 2019)</text>
    <rect x="36" y="262" width="396" height="108" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="46" y="280" font-size="10.8" font-weight="700" fill="#0f172a">Unconstrained Bilinear Tensor System over 𝔽₂:</text>
    <text x="234.0" y="301" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.4" font-weight="700" fill="#1d4ed8">T₃,₃,₃ = ∑ A⁽ℓ⁾ ⊗ B⁽ℓ⁾ ⊗ C⁽ℓ⁾  (ℓ = 1…22, mod 2)</text>
    <text x="234.0" y="321" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.9" fill="#334155">⨁ a⁽ℓ⁾ᵢⱼ b⁽ℓ⁾ₖₘ c⁽ℓ⁾ₚₙ  ≡  δ(j=k, m=p, n=i)  [729 eqs, ℓ=1..22]</text>
    <text x="46" y="342" font-size="9.6" fill="#475569">• 22 × 27 = 594 binary decision variables define all 22 bilinear products.</text>
    <text x="46" y="358" font-size="9.6" fill="#475569">• Huge symmetry group: S₂₂ layer permutations × (GL₃(𝔽₂))³ × C₃ transpose.</text>
    <rect x="36" y="380" width="396" height="68" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="46" y="398" font-size="10.4" font-weight="700" fill="#b45309">Pure Open Benchmark (Zero Units, Zero Symmetry Breaking):</text>
    <text x="46" y="415" font-size="9.4" fill="#334155">• Unlike Challenges 1–3, no type-3 terms are pinned or forbidden.</text>
    <text x="46" y="430" font-size="9.4" fill="#334155">• Degree-3 non-linear ANF (60,750 eqs) coupled via 7,290 4-XOR parity chains.</text>
    <rect x="460" y="76" width="438" height="384" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="460" y="76" width="438" height="28" rx="9" fill="#2563eb"/>
    <rect x="460" y="92" width="438" height="12" fill="#2563eb"/>
    <text x="679.0" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2. Plain 2-AND + 4-XOR Circuit (24,975 Vars · 111,780 Cls)</text>
    <rect x="474" y="116" width="410" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
    <text x="484" y="135" font-size="10.6" font-weight="700" fill="#1d4ed8">Stage 1 — Factor Matrix Entries (orig)</text>
    <text x="874" y="135" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#1e293b">594 vars (1..594)</text>
    <text x="484" y="154" font-size="9.5" fill="#334155">22 layers × (9 A + 9 B + 9 C) bits ∈ {0, 1}</text>
    <line x1="679.0" y1="168" x2="679.0" y2="179" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
    <rect x="474" y="181" width="410" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.1"/>
    <text x="484" y="200" font-size="10.6" font-weight="700" fill="#6d28d9">Stage 2 — Bilinear 2-AND Pairs:  p = a ∧ b</text>
    <text x="874" y="200" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#1e293b">1,782 vars (22×81)</text>
    <text x="484" y="219" font-size="9.5" fill="#334155">3 cls/gate: (p∨¬a∨¬b), (¬p∨a), (¬p∨b) → 5,346 cls</text>
    <line x1="679.0" y1="233" x2="679.0" y2="244" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
    <rect x="474" y="246" width="410" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.1"/>
    <text x="484" y="265" font-size="10.6" font-weight="700" fill="#047857">Stage 3 — Trilinear 2-AND Cubes:  s = p ∧ c</text>
    <text x="874" y="265" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#1e293b">16,038 vars (22×729)</text>
    <text x="484" y="284" font-size="9.5" fill="#334155">3 cls/gate: (s∨¬p∨¬c), (¬s∨p), (¬s∨c) → 48,114 cls</text>
    <line x1="679.0" y1="298" x2="679.0" y2="309" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
    <rect x="474" y="311" width="410" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
    <text x="484" y="330" font-size="10.6" font-weight="700" fill="#b45309">Stage 4 — 729 Brent 22-Term Parity Chains (4-XOR)</text>
    <text x="874" y="330" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#1e293b">6,561 aux (729×9)</text>
    <text x="484" y="349" font-size="9.5" fill="#334155">10 4-XORs/eq = 7,290 XORs × 8 cls = 58,320 4-clauses</text>
    <rect x="474" y="378" width="410" height="74" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="484" y="394" font-size="9.7" font-weight="700" fill="#0f172a">Exact Clause Spectrum (111,780 cls; cf. 6pooled3and-c4: 19,548 vars):</text>
    <rect x="484.0" y="401" width="124.3" height="19" fill="#2563eb" stroke="#ffffff" stroke-width="0.9"/>
    <text x="546.2" y="414" text-anchor="middle" font-size="8.6" font-weight="700" fill="#ffffff">2-cl: 35,640 (32%)</text>
    <rect x="608.3" y="401" width="62.2" height="19" fill="#7c3aed" stroke="#ffffff" stroke-width="0.9"/>
    <text x="639.4" y="414" text-anchor="middle" font-size="8.6" font-weight="700" fill="#ffffff">3-cl: 17,820</text>
    <rect x="670.5" y="401" width="203.5" height="19" fill="#d97706" stroke="#ffffff" stroke-width="0.9"/>
    <text x="772.3" y="414" text-anchor="middle" font-size="8.6" font-weight="700" fill="#ffffff">4-cl (4-XORs): 58,320 (52%)</text>
    <text x="484" y="436" font-size="9.4" fill="#475569">α = 4.48 · ρ_crit = 1.83× (Over) · κ = 0.95 · k̄ = 3.20 · 74% Horn · 299,699 AIG ANDs</text>
