<text x="281.0" y="352" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8" font-weight="700" fill="#0f172a">∑ (all 2k nodes):  2 · ∑ xₑ  ≡  0 (mod 2)   ≠   1 (root charge)  ⇒  UNSAT</text>
<text x="281.0" y="370" text-anchor="middle" font-size="9.2" fill="#475569">Pure 3-SAT with α = 2.67 (ρ_c = 0.62×, deeply under-constrained), yet Resolution requires 2^Ω(n)!</text>
<text x="281.0" y="383" text-anchor="middle" font-size="8.9" font-weight="600" fill="#047857">Zero-copy 𝔽₂ Gaussian elimination collapses all 160–400 clauses to 40–100 XORs in &lt;1.5 ms.</text>
