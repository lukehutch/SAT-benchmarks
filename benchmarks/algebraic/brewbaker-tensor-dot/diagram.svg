  <rect x="524" y="116" width="396" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="538" y="135" font-size="11.2" font-weight="700" fill="#0f172a">Universal Algebraic Lower Bound (Every m &#x2265; 2)</text>
  <text x="538" y="153" font-size="9.6" fill="#334155">For any prime p | m, projecting &#x2124;/m&#x2124; &#x2192; &#x1D53D;&#x209A; maps U&#x00B7;diag(W)&#x00B7;V&#x1D40; = I&#x2099; to an</text>
  <text x="538" y="167" font-size="9.6" fill="#334155">N&#x00D7;N matrix of rank at most K, which is impossible whenever K &lt; N.</text>
  <rect x="538" y="178" width="178" height="39" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="627" y="194" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">K = N - 1 : Always UNSAT</text>
  <text x="627" y="209" text-anchor="middle" font-size="8.6" fill="#7f1d1d">Hard resolution rank-lower-bound proof</text>
  <rect x="728" y="178" width="178" height="39" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1"/>
  <text x="817" y="194" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">K = N : Always SAT</text>
  <text x="817" y="209" text-anchor="middle" font-size="8.6" fill="#166534">GL(N, Z/mZ) basis decompositions</text>
  <rect x="24" y="252" width="912" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="272" font-size="11.8" font-weight="700" fill="#0f172a">2. Algebraic Encoding Regimes Across Prime Fields (&#x1D53D;&#x2082;, &#x1D53D;&#x2083;) and Composite Ring &#x2124;/4&#x2124;</text>
  <rect x="38" y="283" width="286" height="51" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="181.0" y="302" text-anchor="middle" font-size="10.4" font-weight="700" fill="#1d4ed8">m = 2 (GF(2) Field)</text>
  <text x="181.0" y="321" text-anchor="middle" font-size="8.6" fill="#334155">Bit-level and2 + xor2; exposes 75-180 native XORs in xcnf-converted/</text>
  <rect x="337" y="283" width="286" height="51" rx="7" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.1"/>
  <text x="480.0" y="302" text-anchor="middle" font-size="10.4" font-weight="700" fill="#6d28d9">m = 3 (GF(3) Odd Prime Field)</text>
  <text x="480.0" y="321" text-anchor="middle" font-size="8.6" fill="#334155">One-hot EO(3) residues + 9-clause mult/add tables; 0 XORs, high density</text>
  <rect x="636" y="283" width="286" height="51" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="779.0" y="302" text-anchor="middle" font-size="10.4" font-weight="700" fill="#b45309">m = 4 (Z/4Z with Zero Divisors)</text>
  <text x="779.0" y="321" text-anchor="middle" font-size="8.6" fill="#334155">2*2 = 0 (mod 4) creates non-field nilpotent terms; 16-clause tables</text>
  <rect x="24" y="358" width="912" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="378" font-size="11.8" font-weight="700" fill="#0f172a">3. Five Tight UNSAT / SAT Optimality Brackets (10 Instances, N &#x2208; &#x007B;3, 5, 6&#x007D;, m &#x2208; &#x007B;2, 3, 4&#x007D;)</text>
  <rect x="38" y="389" width="169" height="68" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="122.5" y="406" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8" font-weight="700" fill="#d97706">dot N=3, mod 4</text>
  <text x="122.5" y="422" text-anchor="middle" font-size="10.2" font-weight="700" fill="#0f172a">K = 2 / 3 (UNSAT/SAT)</text>
  <text x="122.5" y="436" text-anchor="middle" font-size="8.4" fill="#334155">237-373 vars | 1.1K-1.8K cls</text>
  <text x="122.5" y="449" text-anchor="middle" font-size="8.2" fill="#475569">Chad's headline example</text>
  <rect x="217" y="389" width="169" height="68" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="301.5" y="406" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8" font-weight="700" fill="#2563eb">dot N=5, mod 2</text>
  <text x="301.5" y="422" text-anchor="middle" font-size="10.2" font-weight="700" fill="#0f172a">K = 4 / 5 (UNSAT/SAT)</text>
  <text x="301.5" y="436" text-anchor="middle" font-size="8.4" fill="#334155">320-406 vars | 75-100 XORs</text>
  <text x="301.5" y="449" text-anchor="middle" font-size="8.2" fill="#475569">GF(2) rank-5 proof</text>
  <rect x="396" y="389" width="169" height="68" rx="7" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="480.5" y="406" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8" font-weight="700" fill="#1d4ed8">dot N=6, mod 2</text>
