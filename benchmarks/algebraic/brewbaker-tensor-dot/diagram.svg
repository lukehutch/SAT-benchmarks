  <text x="480.5" y="436" text-anchor="middle" font-size="8.4" fill="#334155">570-691 vars | 144-180 XORs</text>
  <text x="480.5" y="449" text-anchor="middle" font-size="8.2" fill="#475569">GF(2) hard rank-6 proof</text>
  <rect x="575" y="389" width="169" height="68" rx="7" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.1"/>
