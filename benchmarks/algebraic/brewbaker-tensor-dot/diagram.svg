  <text x="659.5" y="436" text-anchor="middle" font-size="8.4" fill="#334155">958-1,216 vars | 3.8K-4.8K cls</text>
  <text x="659.5" y="449" text-anchor="middle" font-size="8.2" fill="#475569">GF(3) rank-5 frontier</text>
