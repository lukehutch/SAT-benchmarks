<text x="246.0" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.4" font-weight="700" fill="#0f172a">p(t) = 1 + t + tˢ</text>
<text x="246.0" y="173" font-size="9.4" fill="#334155">Frobenius (char 2, n = 2ᵏ):</text>
<text x="246.0" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" font-weight="700" fill="#2563eb">p(t)ⁿ = 1 + tⁿ + tˢⁿ ≡ 1</text>
<rect x="236.0" y="214" width="202.0" height="88" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.1"/>
<text x="246.0" y="231" font-size="10.2" font-weight="700" fill="#047857">Full Rank &amp; Unique Witness</text>
<text x="246.0" y="247" font-size="9.4" fill="#1e293b">• det(C₃) = 1,  rank(C₃) = n</text>
<text x="246.0" y="262" font-size="9.4" fill="#1e293b">• ker(C₃) = {0}</text>
<text x="246.0" y="277" font-size="9.4" fill="#1e293b">• Unique x★ = C₃⁻¹·b (SAT)</text>
<text x="246.0" y="292" font-size="9" font-weight="600" fill="#047857">n ∈ {64, 256, 1024, 4096}</text>
<rect x="38" y="338" width="400" height="60" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="238.0" y="358" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.2" font-weight="700" fill="#0f172a">Row i:  xᵢ ⊕ x₍ᵢ₊₁₎ mod n ⊕ x₍ᵢ₊ₛ₎ mod n = bᵢ</text>
<text x="238.0" y="376" text-anchor="middle" font-size="9.3" fill="#475569">2D torus-like stride s = √n forces ≥ 2^(√n / 3√2) merge-tree blowup;</text>
