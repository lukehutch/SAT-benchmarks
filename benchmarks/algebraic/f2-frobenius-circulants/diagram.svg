<text x="690.0" y="139" font-size="10.2" font-weight="700" fill="#b91c1c">Singular Tap Polynomial</text>
<text x="690.0" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a">q(t) = (1+t)(1+tˢ)</text>
<text x="690.0" y="173" font-size="9.4" fill="#334155">Zero root at t = 1:</text>
<text x="690.0" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" font-weight="700" fill="#dc2626">q(1) = 0 ⇒ 𝟏ᵀ·C₄ = 𝟎</text>
<rect x="680.0" y="214" width="202.0" height="88" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/>
<text x="690.0" y="231" font-size="10.2" font-weight="700" fill="#b91c1c">Left-Kernel Obstruction</text>
<text x="690.0" y="247" font-size="9.3" fill="#1e293b">• Every col has even wt 4</text>
<text x="690.0" y="262" font-size="9.3" fill="#1e293b">• ∑ᵢ (C₄x)ᵢ = 4∑ xⱼ ≡ 0</text>
<text x="690.0" y="277" font-size="9.3" fill="#1e293b">• Flip b₀ ⇒ ∑ᵢ bᵢ ≡ 1</text>
<text x="690.0" y="292" font-size="9.2" font-weight="700" fill="#b91c1c">0 ≡ 1 (mod 2) ⇒ UNSAT!</text>
