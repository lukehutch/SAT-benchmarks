  <text x="402.0" y="314" text-anchor="middle" font-size="9.6" font-weight="700" fill="#15803d">s&#x2099; = &#x03B4;&#x1D62;&#x2C7C;</text>
  <text x="402.0" y="328" text-anchor="middle" font-size="8.4" fill="#475569">clamped</text>
