  <text x="183.0" y="314" text-anchor="middle" font-size="9.6" font-weight="700" fill="#5b21b6">s&#x2081; (mod m)</text>
  <text x="183.0" y="328" text-anchor="middle" font-size="8.4" fill="#475569">+A[i,0]&#x00B7;B[0,j]</text>
