  <text x="38" y="260" font-size="12" font-weight="700" fill="#6d28d9">2A. One-Hot Running-Sum Encoding (onehot)</text>
  <text x="38" y="276" font-size="9.6" fill="#475569">Domain: m Boolean vars per entry with EO(m) exactly-one constraints</text>
