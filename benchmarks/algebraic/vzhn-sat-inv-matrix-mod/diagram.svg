  <text x="40" y="364" font-size="9.5" fill="#1e293b">&#x2022; Transition implications: &#x00AC;s[k&#x2212;1,u] &#x2228; &#x00AC;B[k,j,v] &#x2228; s[k, (u+A&#x00B7;v) mod m]</text>
  <text x="40" y="379" font-size="9.5" fill="#1e293b">&#x2022; Clause size O(n&#x00B3;m&#x00B2;): direct table transitions for m &#x2208; &#x007B;2, 3, 13, 26, 27&#x007D;</text>
  <text x="40" y="394" font-size="9.4" font-weight="700" fill="#6d28d9">&#x2022; Over &#x1D53D;&#x2082; (m = 2): EO(2) bit pairs (b&#x2080;, b&#x2081;) disguise parity from syntactic XOR scanners</text>
