  <text x="626" y="321" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">+</text>
  <line x1="751" y1="317" x2="775" y2="317" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arr-b)"/>
  <text x="494" y="364" font-size="9.5" fill="#1e293b">&#x2022; Exact integer identity: &#x03A3;&#x2096; A[i,k]&#x00B7;B[k,j] &#x2212; m&#x00B7;Q[i,j] = &#x03B4;&#x1D62;&#x2C7C; (0 &#x2264; B &lt; m)</text>
  <text x="494" y="379" font-size="9.5" fill="#1e293b">&#x2022; Compact for large m (e.g. mod 26: 5,079 binary vs 20,970 one-hot clauses)</text>
  <text x="494" y="394" font-size="9.4" font-weight="700" fill="#1d4ed8">&#x2022; Over &#x1D53D;&#x2082; (m = 2): exposes 43,911 explicit Tseitin XORs in xcnf-converted/</text>
