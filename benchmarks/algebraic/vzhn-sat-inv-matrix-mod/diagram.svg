  <text x="297.0" y="314" text-anchor="middle" font-size="9.6" font-weight="700" fill="#5b21b6">s&#x2096; (mod m)</text>
  <text x="297.0" y="328" text-anchor="middle" font-size="8.4" fill="#475569">+A[i,k]&#x00B7;B[k,j]</text>
