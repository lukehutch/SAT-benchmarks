    <text x="50" y="402" font-size="10.2" font-weight="700" fill="#0f172a">Exact Vertex-Sum Equations (All 4 Vertices = K = 20):</text>
    <text x="50" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" font-weight="600" fill="#047857">v₁:  9 + (5 + 2 + 4) = 20</text>
    <text x="248" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" font-weight="600" fill="#047857">v₂:  8 + (5 + 1 + 6) = 20</text>
    <text x="50" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" font-weight="600" fill="#047857">v₃: 10 + (2 + 1 + 7) = 20</text>
    <text x="248" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" font-weight="600" fill="#047857">v₄:  3 + (4 + 6 + 7) = 20</text>
    <text x="50" y="458" font-size="9.2" fill="#475569">Labels used: V = {3, 8, 9, 10}, E = {1, 2, 4, 5, 6, 7}  ⇒  exact bijection onto {1..10}</text>
    <rect x="474" y="78" width="442" height="154" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="488" y="100" font-size="12.4" font-weight="700" fill="#0f172a">2. Arithmetic Feasibility Bound &amp; CDCL Hardness</text>
    <rect x="488" y="110" width="414" height="46" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="695.0" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.2" font-weight="700" fill="#991b1b">n·K + Σᵢ Vᵢ = M(M+1),   M = n(n+1)/2</text>
    <text x="695.0" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" font-weight="600" fill="#7f1d1d">K_min(n) = ⌈n(n²+3)/4⌉  ≤  K  ≤  ⌊n(n+1)²/4⌋ = K_max(n)</text>
    <text x="488" y="174" font-size="9.8" fill="#334155">• Any K &lt; K_min(n) (e.g., K₅ at K=34, K₆ at K=58, K₁₀ at K=257) is</text>
    <text x="496" y="189" font-size="9.8" fill="#334155">mathematically UNSAT by global double-counting of edge labels.</text>
    <text x="488" y="206" font-size="9.8" fill="#334155">• Picat-SAT compiles all_different + n log-bit adder trees separately,</text>
    <text x="496" y="221" font-size="9.8" fill="#334155">hiding the global sum identity and creating 490-var CDCL killers.</text>
