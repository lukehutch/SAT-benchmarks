  <text x="40" y="372" class="h3">Propositional SAT Encoding (Hoos, 1998 — Musical 12-Tone Rows at n = 12)</text>
  <text x="40" y="393" class="mono">• Series vars sᵢ,ᵥ ∈ {0,1} (Exactly-1 value v per slot i; Exactly-1 slot per value v)</text>
  <text x="40" y="412" class="mono">• Diff vars   dᵢ,ₖ ∈ {0,1} (dᵢ,ₖ ⇔ ∨_{|u−v|=k} (sᵢ,ᵤ ∧ sᵢ₊₁,ᵥ); all k ∈ 1..n−1 distinct)</text>
  <text x="40" y="432" class="body">Inspired by Alban Berg's all-interval 12-tone serial rows (1,928 distinct rows at n = 12).</text>
