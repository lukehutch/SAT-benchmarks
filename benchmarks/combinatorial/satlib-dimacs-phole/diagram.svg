<text x="496" y="122" font-size="9.8" font-weight="700" fill="#047857">At-Least-One (ALO — n+1 positive n-clauses):</text>
<text x="496" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" fill="#0f172a">∀ i ∈ {1..n+1}:   xᵢ,₁ ∨ xᵢ,₂ ∨ … ∨ xᵢ,ₙ</text>
<rect x="486" y="158" width="398" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.15"/>
<text x="496" y="174" font-size="9.8" font-weight="700" fill="#b91c1c">At-Most-One (AMO — n·C(n+1,2) binary Horn clauses, 95–98%):</text>
<text x="496" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" fill="#0f172a">∀ j ∈ {1..n}, i &lt; k:   ¬xᵢ,ⱼ ∨ ¬xₖ,ⱼ</text>
<text x="488" y="216" font-size="8.9" fill="#475569">Zero XOR clauses · Deg CV = 0.00 (completely symmetric across pigeons &amp; holes)</text>
