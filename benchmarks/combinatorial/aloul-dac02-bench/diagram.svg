    <text x="600" y="276" font-size="10.2" font-weight="700" fill="#6d28d9">Lex-Leader Symmetry-Breaking Predicate (SBP):</text>
    <text x="600" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8" fill="#0f172a">SBP(F) = ⋀<tspan baseline-shift="sub" font-size="72%">σ∈G</tspan> [ x ≤<tspan baseline-shift="sub" font-size="72%">lex</tspan> σ(x) ]</text>
    <text x="600" y="306" font-size="9.4" fill="#475569">Retains ≥ 1 model per orbit; preserves SAT/UNSAT</text>
    <rect x="576" y="338" width="320" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="590" y="359" font-size="12" font-weight="700" fill="#0f172a">Suite Impact &amp; Format Metrics</text>
    <text x="590" y="379.0" font-size="9.8" font-weight="700" fill="#1d4ed8">Dimensions:</text>
    <text x="668" y="379.0" font-size="9.7" fill="#334155">46–1,056 vars · 204–10,862 clauses</text>
    <text x="590" y="396.5" font-size="9.8" font-weight="700" fill="#1d4ed8">Regime:</text>
    <text x="668" y="396.5" font-size="9.7" fill="#334155">6 Under (Urq) / 26 Over · Med ρ<tspan baseline-shift="sub" font-size="72%">crit</tspan> = 4.50×</text>
