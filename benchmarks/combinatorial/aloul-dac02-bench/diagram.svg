    <text x="668" y="414.0" font-size="9.7" fill="#334155">618 total (312 Urq + 306 s3-3 grids)</text>
    <text x="590" y="431.5" font-size="9.8" font-weight="700" fill="#1d4ed8">Pure CDCL:</text>
    <text x="668" y="431.5" font-size="9.7" fill="#334155">17–24 / 32 solved in 5 s (chokes on PHP/Urq)</text>
    <text x="590" y="449.0" font-size="9.8" font-weight="700" fill="#1d4ed8">Sym/Alg SAT:</text>
    <text x="668" y="449.0" font-size="9.7" fill="#334155">32 / 32 solved in 0.36–0.45 s combined</text>
