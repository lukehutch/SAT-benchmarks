  <text x="40" y="444" class="body">Bold diagonal = idempotence (a*a = a); rows &amp; cols bijective.</text>
  <rect x="454" y="80" width="462" height="156" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="470" y="104" class="h3">Boolean CNF Encoding (n³ Variables: x(a, b, c) ⇔ a*b = c)</text>
  <text x="470" y="126" class="mono">1. Cell bijection:   ∀a,b: ∑c x(a,b,c) = 1</text>
  <text x="470" y="145" class="mono">2. Row uniqueness:   ∀a,c: ∑b x(a,b,c) = 1</text>
  <text x="470" y="164" class="mono">3. Col uniqueness:   ∀b,c: ∑a x(a,b,c) = 1</text>
  <text x="470" y="183" class="mono">4. Idempotence:      ∀a:   x(a,a,a) = 1   (unit clauses)</text>
  <text x="470" y="202" class="mono">5. Algebraic Law:    QG1–QG7 horn/4-clauses (68,083 in qg1-07)</text>
  <text x="470" y="223" class="body">Each order-n quasigroup uses n³ Boolean variables (n=7 → 343, n=13 → 2,197).</text>
  <rect x="454" y="250" width="462" height="208" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="470" y="274" class="h3">Zhang's Quasigroup Families (22 Instances: 10 SAT / 12 UNSAT)</text>
  <rect x="470" y="286" width="38" height="17" rx="4" fill="#2563eb"/>
  <text x="489" y="298" text-anchor="middle" style="font:700 10px monospace;fill:#ffffff;">QG1</text>
  <text x="516" y="298" class="mono">(3,2,1)-conjugate orthogonal</text>
  <text x="902" y="298" text-anchor="end" class="body">n=7,8 SAT</text>
  <rect x="470" y="309" width="38" height="17" rx="4" fill="#2563eb"/>
  <text x="489" y="321" text-anchor="middle" style="font:700 10px monospace;fill:#ffffff;">QG2</text>
  <text x="516" y="321" class="mono">(3,1,2)-conjugate orthogonal</text>
  <text x="902" y="321" text-anchor="end" class="body">n=7,8 SAT</text>
  <rect x="470" y="332" width="38" height="17" rx="4" fill="#2563eb"/>
  <text x="489" y="344" text-anchor="middle" style="font:700 10px monospace;fill:#ffffff;">QG3</text>
  <text x="516" y="344" class="mono">(a*b)*(b*a) = a  (Stein's 1st law)</text>
  <text x="902" y="344" text-anchor="end" class="body">n=8 SAT · n=9 UNSAT</text>
  <rect x="470" y="355" width="38" height="17" rx="4" fill="#2563eb"/>
  <text x="489" y="367" text-anchor="middle" style="font:700 10px monospace;fill:#ffffff;">QG4</text>
  <text x="516" y="367" class="mono">(b*a)*(a*b) = a  (Stein's 2nd law)</text>
  <text x="902" y="367" text-anchor="end" class="body">n=8 UNSAT · n=9 SAT</text>
  <rect x="470" y="378" width="38" height="17" rx="4" fill="#2563eb"/>
  <text x="489" y="390" text-anchor="middle" style="font:700 10px monospace;fill:#ffffff;">QG5</text>
  <text x="516" y="390" class="mono">((b*a)*b)*b = a  (Schröder)</text>
  <text x="902" y="390" text-anchor="end" class="body">n=11 SAT · n=9,10,12,13 UNSAT</text>
  <rect x="470" y="401" width="38" height="17" rx="4" fill="#2563eb"/>
  <text x="489" y="413" text-anchor="middle" style="font:700 10px monospace;fill:#ffffff;">QG6</text>
  <text x="516" y="413" class="mono">(a*b)*b = a*(a*b)  (Stein's 3rd)</text>
  <text x="902" y="413" text-anchor="end" class="body">n=9 SAT · n=10..12 UNSAT</text>
  <rect x="470" y="424" width="38" height="17" rx="4" fill="#2563eb"/>
  <text x="489" y="436" text-anchor="middle" style="font:700 10px monospace;fill:#ffffff;">QG7</text>
  <text x="516" y="436" class="mono">(b*a)*b = a*(b*a)  (Stein's 4th)</text>
  <text x="902" y="436" text-anchor="end" class="body">n=9,13 SAT · n=10..12 UNSAT</text>
