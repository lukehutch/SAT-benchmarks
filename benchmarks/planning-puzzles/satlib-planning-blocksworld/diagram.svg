  <text x="40" y="342" class="h3">SATPLAN Time-Indexed Encoding (Axioms over Steps t = 0 … T)</text>
  <text x="40" y="363" class="mono">• Fluents:        on(x, y, t),  clear(x, t),  onTable(x, t)</text>
  <text x="40" y="382" class="mono">• Action axioms:  move(x, y, z, t) ⇒ clear(x,t) ∧ clear(z,t) ∧ on(x,y,t)</text>
  <text x="40" y="401" class="mono">• Frame axioms:   on(x,y,t) ∧ ¬on(x,y,t+1) ⇒ ∨_z move(x,y,z,t)</text>
  <text x="40" y="421" class="body">A satisfying assignment directly decodes into an exact parallel/sequential block plan.</text>
