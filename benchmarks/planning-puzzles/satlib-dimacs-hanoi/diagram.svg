  <text x="40" y="328" class="h3">SATPLAN Propositional Encoding (Selman &amp; Kautz, 1996)</text>
  <text x="40" y="348" class="body">State atoms on(d, x, t) and move actions move(d, src, dst, t) over time steps t ∈ {0, …, 2ⁿ − 1}:</text>
  <text x="40" y="370" class="mono">• Preconditions:  move(d, a, b, t) ⇒ clear(d, t) ∧ clear(b, t) ∧ smaller(d, b)</text>
  <text x="40" y="389" class="mono">• Effects &amp; Frame: move(d, a, b, t) ⇒ on(d, b, t+1) ∧ ¬on(d, a, t+1)</text>
  <text x="40" y="408" class="mono">• Exactly-one action per step t; initial state at t=0, goal state at t=T</text>
  <rect x="578" y="304" width="338" height="122" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="594" y="328" class="h3">Benchmark Instances (Parsed Headers)</text>
  <text x="594" y="352" class="mono">hanoi4.cnf:  4 disks · 15 steps</text>
  <text x="606" y="369" class="body">718 vars · 4,934 clauses · SAT</text>
  <text x="594" y="394" class="mono">hanoi5.cnf:  5 disks · 31 steps</text>
  <text x="606" y="411" class="body">1,931 vars · 14,468 clauses · SAT</text>
