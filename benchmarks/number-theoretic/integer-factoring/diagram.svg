  </defs>
  <rect x="2" y="2" width="916" height="486" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="28" y="34" font-size="17.5" font-weight="700" fill="#0f172a">Pure-Logic Integer Factorization &amp; Masked Multipliers (integer-factoring)</text>
    <text x="28" y="53" font-size="11.8" fill="#475569">Inverting Wallace &amp; Karatsuba AIG multipliers (p × q = N) with symmetry guards &amp; 16 sparse 𝔽₂ parity leaks</text>
    <rect x="752" y="18" width="142" height="24" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="823" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">5 SAT · 1 UNSAT</text>
