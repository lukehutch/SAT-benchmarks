    <text x="481.0" y="313" text-anchor="middle" font-size="9.5" font-weight="600" fill="#047857">SAT: semiprime N = p·q</text>
    <text x="481.0" y="329" text-anchor="middle" font-size="9.5" font-weight="600" fill="#dc2626">UNSAT: prime N (28b)</text>
    <rect x="40" y="360" width="526" height="94" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="54" y="380" font-size="11.5" font-weight="700" fill="#6d28d9">Masked Multiplier Side-Channel Overlay (masked_mult_32b_xor16)</text>
    <text x="54" y="397" font-size="10" fill="#334155">Augments 32-bit Wallace factoring (N = 65519 × 65521) with 16 sparse 4-bit 𝔽₂ linear parity leaks:</text>
    <rect x="54" y="407" width="158" height="24" rx="5" fill="#ffffff" stroke="#a78bfa" stroke-width="1.1"/>
    <text x="133.0" y="422.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.1" font-weight="600" fill="#6d28d9">p₃ ⊕ p₁₁ ⊕ q₅ ⊕ q₁₄ = b₁</text>
    <rect x="222" y="407" width="158" height="24" rx="5" fill="#ffffff" stroke="#a78bfa" stroke-width="1.1"/>
    <text x="301.0" y="422.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.1" font-weight="600" fill="#6d28d9">p₂ ⊕ p₈ ⊕ q₁ ⊕ q₁₃ = b₂</text>
    <rect x="390" y="407" width="160" height="24" rx="5" fill="#ffffff" stroke="#a78bfa" stroke-width="1.1"/>
    <text x="470.0" y="422.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.1" font-weight="600" fill="#6d28d9">… (16 sparse XOR₄ leaks)</text>
    <text x="54" y="446" font-size="9.4" fill="#475569">Tests hybrid CDCL + GF(2) Gaussian elimination coupling nonlinear carry chains with sparse linear equations</text>
    <rect x="598" y="78" width="298" height="262" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
