    <text x="96" y="332" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.3" fill="#0f172a">1 &lt; p ≤ q</text>
    <path d="M 152 160 L 184 160" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr-blue)"/>
    <path d="M 152 176 C 176 176, 176 228, 184 228" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purp)"/>
    <path d="M 152 236 C 176 236, 176 240, 184 240" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purp)"/>
    <path d="M 152 256 C 178 256, 178 302, 184 302" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr-blue)"/>
    <rect x="186" y="134" width="176" height="56" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="274.0" y="157" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1d4ed8">z₂ = p_hi × q_hi</text>
    <text x="274.0" y="175" text-anchor="middle" font-size="9.3" fill="#475569">Wallace base (k ≤ 8)</text>
    <rect x="186" y="202" width="176" height="56" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="274.0" y="225" text-anchor="middle" font-size="10.2" font-weight="700" fill="#6d28d9">z_mid = (p_lo+p_hi)(q_lo+q_hi)</text>
    <text x="274.0" y="243" text-anchor="middle" font-size="9.3" fill="#475569">z₁ = z_mid − (z₀ + z₂)</text>
    <rect x="186" y="274" width="176" height="56" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="274.0" y="297" text-anchor="middle" font-size="10.2" font-weight="700" fill="#1d4ed8">z₀ = p_lo × q_lo</text>
    <text x="274.0" y="315" text-anchor="middle" font-size="9.3" fill="#475569">Wallace base (k ≤ 8)</text>
