    <line x1="362" y1="302" x2="394" y2="302" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arr-blue)"/>
    <rect x="396" y="134" width="170" height="122" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="481.0" y="154" text-anchor="middle" font-size="10.8" font-weight="700" fill="#047857">Shift &amp; 3-Row Wallace</text>
    <text x="481.0" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#0f172a">z₀ + (z₁ ≪ m)</text>
    <text x="481.0" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.4" font-weight="700" fill="#0f172a">   + (z₂ ≪ 2m)</text>
    <line x1="410" y1="201" x2="552" y2="201" stroke="#e2e8f0" stroke-width="1"/>
    <text x="481.0" y="218" text-anchor="middle" font-size="9.5" fill="#475569">Final CPA → product P</text>
    <text x="481.0" y="234" text-anchor="middle" font-size="9.2" fill="#64748b">O(n¹·⁵⁸⁵) AIG gates</text>
    <text x="481.0" y="248" text-anchor="middle" font-size="9.2" fill="#64748b">(coupled carry chains)</text>
    <line x1="481.0" y1="256" x2="481.0" y2="273" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-grn)"/>
    <rect x="396" y="276" width="170" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
