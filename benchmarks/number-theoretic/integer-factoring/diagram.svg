    <rect x="24" y="78" width="558" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="40" y="100" font-size="13" font-weight="700" fill="#0f172a">Karatsuba Recursive Multiplier Inversion &amp; 𝔽₂ Side-Channel Overlay</text>
    <text x="40" y="116" font-size="10.4" fill="#475569">Native AIGER 1.9 circuits asserting p × q = N with odd LSBs p₀ = q₀ = 1 and ordering guard 1 &lt; p ≤ q</text>
    <rect x="40" y="134" width="112" height="62" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="96" y="151" text-anchor="middle" font-size="10.8" font-weight="700" fill="#1d4ed8">Unknown p (n/2 b)</text>
    <rect x="48" y="160" width="44" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="70" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#0f172a">p_hi</text>
    <rect x="98" y="160" width="46" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="121" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#0f172a">p_lo|1</text>
    <rect x="40" y="210" width="112" height="62" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="96" y="227" text-anchor="middle" font-size="10.8" font-weight="700" fill="#1d4ed8">Unknown q (n/2 b)</text>
    <rect x="48" y="236" width="44" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="70" y="253" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#0f172a">q_hi</text>
    <rect x="98" y="236" width="46" height="26" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="121" y="253" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#0f172a">q_lo|1</text>
    <rect x="40" y="284" width="112" height="60" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
