    <rect x="608" y="266" width="278" height="31" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.9"/>
    <text x="616" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#0f172a">factor_wallace_40b</text>
    <rect x="838" y="270" width="42" height="14" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="0.9"/>
    <text x="859" y="280" text-anchor="middle" font-size="8.2" font-weight="700" fill="#2563eb">SAT</text>
    <text x="616" y="291.5" font-size="8.6" fill="#475569">960,017 × 1,048,573 (40b) · 4,296 AND · 1,271 v · 409 XOR</text>
