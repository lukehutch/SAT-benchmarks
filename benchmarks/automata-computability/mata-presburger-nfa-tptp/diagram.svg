<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 485" width="940" height="485">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 18px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 12.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
      .h3 { font: 700 13.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 11.6px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #334155; }
      .mono { font: 600 11px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1e293b; }
      .st { font: 700 12px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #0f172a; }
      .lbl { font: 700 11.5px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #2563eb; }
      .badge-s { font: 700 11px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #047857; }
    </style>
  </defs>
  <rect x="2" y="2" width="936" height="481" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="26" y="34" class="title">MATA Presburger Explicit-Complement NFAs — TPTP (ARI / NUM)</text>
  <text x="26" y="54" class="sub">Real finite automata parsed from mata-orig/ (21 NFAs: 17 SAT non-universal / 4 UNSAT universal)</text>
  <line x1="24" y1="66" x2="916" y2="66" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="80" width="892" height="162" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="40" y="104" class="h3">1. Parsed Real NFA: mata-orig/ARI056_1.mata.xz (6 States, 6 Transitions, Binary Alphabet Σ = {0, 1})</text>
  <rect x="758" y="90" width="144" height="21" rx="10.5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="830" y="104" text-anchor="middle" class="badge-s">L(A)ᶜ ≠ ∅ (SAT)</text>
  <line x1="54" y1="178" x2="85" y2="178" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-b)"/>
  <text x="50" y="170" class="mono" fill="#2563eb">init</text>
  <line x1="132" y1="178" x2="229" y2="178" stroke="#334155" stroke-width="2.1" marker-end="url(#arr)"/>
  <text x="182.0" y="168" text-anchor="middle" class="lbl">0</text>
  <line x1="276" y1="178" x2="373" y2="178" stroke="#334155" stroke-width="2.1" marker-end="url(#arr)"/>
  <text x="326.0" y="168" text-anchor="middle" class="lbl">0</text>
  <line x1="420" y1="178" x2="517" y2="178" stroke="#334155" stroke-width="2.1" marker-end="url(#arr)"/>
  <text x="470.0" y="168" text-anchor="middle" class="lbl">1</text>
  <line x1="564" y1="178" x2="661" y2="178" stroke="#334155" stroke-width="2.1" marker-end="url(#arr)"/>
  <text x="614.0" y="168" text-anchor="middle" class="lbl">1</text>
  <path d="M 676 158 C 656 112, 716 112, 696 158" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-b)"/>
  <text x="686" y="120" text-anchor="middle" class="lbl">0 (nondet!)</text>
  <line x1="708" y1="178" x2="805" y2="178" stroke="#334155" stroke-width="2.1" marker-end="url(#arr)"/>
  <text x="758.0" y="168" text-anchor="middle" class="lbl">0</text>
  <circle cx="110" cy="178" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="110" y="182.5" text-anchor="middle" class="st">q12</text>
  <circle cx="254" cy="178" r="22" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
  <text x="254" y="182.5" text-anchor="middle" class="st">q6</text>
  <circle cx="398" cy="178" r="22" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
  <text x="398" y="182.5" text-anchor="middle" class="st">q3</text>
  <circle cx="542" cy="178" r="22" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
  <text x="542" y="182.5" text-anchor="middle" class="st">q1</text>
  <circle cx="686" cy="178" r="22" fill="#ffffff" stroke="#475569" stroke-width="2.2"/>
  <text x="686" y="182.5" text-anchor="middle" class="st">q0</text>
  <circle cx="830" cy="178" r="22" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
  <circle cx="830" cy="178" r="17" fill="none" stroke="#059669" stroke-width="1.6"/>
  <text x="830" y="182.5" text-anchor="middle" class="st">q13</text>
  <text x="40" y="228" class="body">Language L(ARI056_1) = 00110⁺ (LSB-first binary integer encoding): nondeterministic branch at q0 on symbol "0" splits into {q0, q13}.</text>
  <rect x="24" y="258" width="430" height="206" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="40" y="282" class="h3">2. Multi-Track Presburger NFA: NUM870_1.mata.xz</text>
  <text x="40" y="300" class="body">4-bit parallel tracks (x₁, x₂, x₃, x₄) ∈ {0,1}⁴ read LSB → MSB</text>
  <line x1="92" y1="386" x2="121" y2="386" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-b)"/>
  <path d="M 137 364 C 114 322, 182 322, 159 364" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="148" y="328" text-anchor="middle" class="lbl" fill="#6d28d9">8 vectors: **00, **11</text>
  <line x1="172" y1="386" x2="329" y2="386" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="252.0" y="376" text-anchor="middle" class="lbl">8 bit-vectors</text>
  <text x="252.0" y="404" text-anchor="middle" class="mono">x₃ = x₄ (mod 2)</text>
  <circle cx="148" cy="386" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="148" y="390.5" text-anchor="middle" class="st">q0</text>
  <circle cx="356" cy="386" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
  <circle cx="356" cy="386" r="19" fill="none" stroke="#059669" stroke-width="1.6"/>
  <text x="356" y="390.5" text-anchor="middle" class="st">q1</text>
  <text x="40" y="446" class="body">Each bit-vector encodes simultaneous k-variable arithmetic digits.</text>
  <rect x="470" y="258" width="446" height="206" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="486" y="282" class="h3">3. Benchmark Task: Explicit NFA Complementation</text>
  <text x="486" y="301" class="body">Quantifier alternation ¬∃x φ(x) in Presburger arithmetic requires L(A)ᶜ:</text>
  <rect x="486" y="318" width="94" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="533" y="341" text-anchor="middle" style="font:700 11px sans-serif;fill:#2563eb;">Input NFA A</text>
  <text x="533" y="358" text-anchor="middle" class="mono">|Q| states</text>
  <line x1="580" y1="345" x2="590" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="592" y="318" width="94" height="54" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="639" y="341" text-anchor="middle" style="font:700 11px sans-serif;fill:#7c3aed;">Subset DFA D</text>
  <text x="639" y="358" text-anchor="middle" class="mono">up to 2^|Q|</text>
  <line x1="686" y1="345" x2="696" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="698" y="318" width="94" height="54" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="745" y="341" text-anchor="middle" style="font:700 11px sans-serif;fill:#d97706;">Flip Finals Fᶜ</text>
  <text x="745" y="358" text-anchor="middle" class="mono">Q_D \ F_D</text>
  <line x1="792" y1="345" x2="802" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="804" y="318" width="94" height="54" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
  <text x="851" y="341" text-anchor="middle" style="font:700 11px sans-serif;fill:#059669;">Emptiness?</text>
  <text x="851" y="358" text-anchor="middle" class="mono">SAT / UNSAT</text>
  <text x="486" y="398" class="mono">• SAT   (17/21): ∃w ∈ Σ* \ L(A)  (complement non-empty)</text>
  <text x="486" y="417" class="mono">• UNSAT  (4/21): L(A) = Σ*       (automaton is universal)</text>
  <text x="486" y="440" class="body">Antichain/bisimulation avoids worst-case 2^|Q| subset explosion.</text>
</svg>
