    <text x="26" y="53" font-size="11.5" fill="#475569">XOR-free cardinality-restricted R = 23 Brent encoding: replaces mod-2 parity with EXACTLY-1 / ZERO-OR-2 + noRank3 + 4 pinned cube pairs</text>
