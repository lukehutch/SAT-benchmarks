    <text x="228" y="376" font-size="9.5" font-weight="700" fill="#b91c1c">6 forbidden 3×3 transversals</text>
    <text x="228" y="390" font-size="9.2" fill="#334155">per A⁽ℓ⁾, B⁽ℓ⁾, C⁽ℓ⁾ matrix ⇒</text>
    <text x="228" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.1" fill="#6d28d9">23 × 3 × 6 = 414 3-clauses</text>
    <text x="46" y="425" font-size="9.3" fill="#334155">• Plus 69 non-empty factor 9-clauses (23×3) &amp; 27 entry-use 23-clauses.</text>
