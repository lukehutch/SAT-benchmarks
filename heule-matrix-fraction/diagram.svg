    <text x="244.0" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1. Replacing Mod-2 XOR Parity with Low-Weight Cardinality</text>
    <rect x="36" y="114" width="416" height="96" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="46" y="132" font-size="10.6" font-weight="700" fill="#047857">A. 27 Type-3 Equations (δ = 1):  Odd Parity  →  EXACTLY-ONE</text>
    <rect x="46" y="140" width="174" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.9"/>
    <text x="133" y="154" text-anchor="middle" font-size="9.0" fill="#64748b">Full 𝔽₂ Brent (XOR):</text>
    <text x="133" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" fill="#334155">∑ s_ℓ ∈ {1, 3, 5, …, 23}</text>
    <line x1="222" y1="156" x2="246" y2="156" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="250" y="140" width="190" height="32" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.1"/>
    <text x="345" y="154" text-anchor="middle" font-size="9.0" font-weight="700" fill="#047857">Fractional Restriction:</text>
    <text x="345" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.9" font-weight="700" fill="#047857">∑ s_ℓ = 1  (ℓ=1..23, exact!)</text>
    <text x="46" y="188" font-size="9.3" fill="#334155">Clauses: 27 ALO 23-clauses + 27 × C(23,2) = 6,831 pairwise binary AMO clauses.</text>
    <text x="46" y="202" font-size="9.1" fill="#64748b">Every type-3 triple appears in exactly 1 rank-1 layer (no 3-way overlaps).</text>
    <rect x="36" y="219" width="416" height="106" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="46" y="237" font-size="10.6" font-weight="700" fill="#1d4ed8">B. 702 Cross-Term Equations (δ = 0):  Even Parity  →  ZERO-OR-TWO</text>
    <rect x="46" y="245" width="174" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.9"/>
    <text x="133" y="259" text-anchor="middle" font-size="9.0" fill="#64748b">Full 𝔽₂ Brent (XOR):</text>
    <text x="133" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" fill="#334155">∑ s_ℓ ∈ {0, 2, 4, …, 22}</text>
    <line x1="222" y1="261" x2="246" y2="261" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="250" y="245" width="190" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
    <text x="345" y="259" text-anchor="middle" font-size="9.0" font-weight="700" fill="#1d4ed8">Fractional Restriction:</text>
    <text x="345" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.9" font-weight="700" fill="#1d4ed8">∑ s_ℓ ∈ {0, 2}  (no ≥4 terms)</text>
    <text x="46" y="293" font-size="9.2" fill="#334155">• Not-1 (printN1): 702 × 23 = 16,146 Horn 23-clauses (¬s_ℓ ∨ ⋁ s_r, r≠ℓ)</text>
    <text x="46" y="308" font-size="9.3" fill="#334155">• At-Most-2 (printAMT): 702 × 20 = 14,040 aux vars (28,080 2-cl + 42,822 3-cl)</text>
    <text x="46" y="320" font-size="8.9" fill="#64748b">Searches the clean fraction of R = 23 schemes with pairwise-only cancellation!</text>
