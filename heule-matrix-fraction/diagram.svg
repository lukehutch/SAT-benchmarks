<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="Heule 3x3 Matrix Multiplication Fractional Variants: XOR-free EXACTLYONE + ZEROTWO">
