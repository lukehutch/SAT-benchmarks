<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="Heule 3x3 Matrix Multiplication XOR-6 Cut Rank Sweep R=27 down to R=22">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="916" height="476" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="26" y="34" font-size="17.5" font-weight="700" fill="#0f172a">Heule 3×3 Matrix Multiplication — XOR-6 Cut Rank Sweep (R = 27 → 22)</text>
    <text x="26" y="53" font-size="11.5" fill="#475569">Six compact 6-variable XOR-cut encodings of T₃,₃,₃ over 𝔽₂ spanning trivial rank 27 to open rank 22 (~10× CDCL blowup per rank step)</text>
    <rect x="740" y="18" width="156" height="26" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="818" y="35" text-anchor="middle" font-size="10.8" font-weight="700" fill="#1d4ed8">5 SAT · 1 OPEN (R=22)</text>
    <line x1="22" y1="64" x2="898" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="22" y="76" width="412" height="384" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="22" y="76" width="412" height="28" rx="9" fill="#2563eb"/>
    <rect x="22" y="92" width="412" height="12" fill="#2563eb"/>
    <text x="228.0" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1. 6-Variable XOR Cut &amp; Root-Arity Scaling</text>
    <rect x="36" y="114" width="384" height="156" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="46" y="131" font-size="10.2" font-weight="700" fill="#0f172a">Breaking Each R-Term Brent Parity Sum (⨁ s_ℓ ≡ δ, ℓ=1..R):</text>
    <rect x="46" y="140" width="66" height="38" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="79" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" font-weight="700" fill="#0f172a">s₁…s₅</text>
    <text x="79" y="170" text-anchor="middle" font-size="8.3" fill="#2563eb">6-XOR → t₁</text>
    <line x1="79" y1="178" x2="160.0" y2="200" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="119" y="140" width="66" height="38" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="152" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" font-weight="700" fill="#0f172a">s₆…s₁₀</text>
    <text x="152" y="170" text-anchor="middle" font-size="8.3" fill="#2563eb">6-XOR → t₂</text>
    <line x1="152" y1="178" x2="194.0" y2="200" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="192" y="140" width="66" height="38" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="225" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" font-weight="700" fill="#0f172a">s₁₁…s₁₅</text>
    <text x="225" y="170" text-anchor="middle" font-size="8.3" fill="#2563eb">6-XOR → t₃</text>
    <line x1="225" y1="178" x2="228.0" y2="200" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="265" y="140" width="66" height="38" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="298" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" font-weight="700" fill="#0f172a">s₁₆…s₂₀</text>
    <text x="298" y="170" text-anchor="middle" font-size="8.3" fill="#2563eb">6-XOR → t₄</text>
    <line x1="298" y1="178" x2="262.0" y2="200" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="338" y="140" width="66" height="38" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="371" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" font-weight="700" fill="#0f172a">s₂₁…s_R</text>
    <text x="371" y="170" text-anchor="middle" font-size="8.3" fill="#7c3aed">6-XOR → tail</text>
    <line x1="371" y1="178" x2="296.0" y2="200" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="84" y="202" width="288" height="36" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="228" y="218" text-anchor="middle" font-size="9.6" font-weight="700" fill="#b45309">Root Parity Cut (carries target δ ∈ {0, 1})</text>
    <text x="228" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.9" fill="#1e293b">Combines t₁…t_k + tail cubes (arity 3, 4, 5, or 6)</text>
    <text x="46" y="258" font-size="9.0" fill="#475569">Direct 3-AND cubes (0 pair vars) + 3R factor ATLEASTONE 9-clauses (a₁₁∨…∨a₃₃).</text>
    <rect x="36" y="280" width="384" height="168" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="46" y="297" font-size="10.2" font-weight="700" fill="#0f172a">Per-Equation XOR-Cut Decomposition (× 729 Equations):</text>
    <text x="46" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#047857">R=27</text>
    <text x="84" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#334155">6×(6-XOR) + 1×(3-XOR)  [5,103 XORs]</text>
    <text x="412" y="315" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.4" fill="#64748b">81×9c</text>
    <rect x="40" y="324" width="376" height="19" fill="#f8fafc"/>
    <text x="46" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#047857">R=26</text>
    <text x="84" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#334155">6×(6-XOR) exact        [4,374 XORs]</text>
    <text x="412" y="336" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.4" fill="#64748b">78×9c</text>
    <text x="46" y="357" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#047857">R=25</text>
    <text x="84" y="357" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#334155">5×(6-XOR) + 1×(5-XOR)  [4,374 XORs]</text>
    <text x="412" y="357" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.4" fill="#64748b">75×9c</text>
    <rect x="40" y="366" width="376" height="19" fill="#f8fafc"/>
    <text x="46" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#b91c1c">R=24</text>
    <text x="84" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#334155">5×(6-XOR) + 1×(4-XOR)  [4,374 XORs]</text>
    <text x="412" y="378" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.4" fill="#64748b">72×9c</text>
    <text x="46" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#b91c1c">R=23</text>
    <text x="84" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#334155">5×(6-XOR) + 1×(3-XOR)  [4,374 XORs]</text>
    <text x="412" y="399" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.4" fill="#64748b">69×9c</text>
    <rect x="40" y="408" width="376" height="19" fill="#f8fafc"/>
    <text x="46" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#7c3aed">R=22</text>
    <text x="84" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#334155">5×(6-XOR) exact        [3,645 XORs]</text>
    <text x="412" y="420" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.4" fill="#64748b">66×9c</text>
    <text x="46" y="440" font-size="8.8" fill="#64748b">All 6 files: α = 8.84–9.26 · ρ_crit = 2.62–2.68× · Deg CV = 0.52–0.54 · 26,244 XORs total</text>
    <rect x="448" y="76" width="450" height="384" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="448" y="76" width="450" height="28" rx="9" fill="#0f172a"/>
    <rect x="448" y="92" width="450" height="12" fill="#0f172a"/>
    <text x="673.0" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2. Empirical 1-Core CDCL Runtime Cliff (T_max = 60 s)</text>
    <rect x="462" y="116" width="422" height="258" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="472" y="134" font-size="10.2" font-weight="700" fill="#0f172a">Best Single-Core Runtime Across 6 Solvers (Log Scale: 0.1 s → 60 s Wall):</text>
