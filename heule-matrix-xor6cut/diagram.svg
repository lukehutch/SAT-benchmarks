    <text x="628.0" y="365" text-anchor="middle" font-size="8.5" font-weight="600" fill="#64748b">1 s</text>
    <line x1="728.1" y1="144" x2="728.1" y2="352" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="728.1" y="365" text-anchor="middle" font-size="8.5" font-weight="600" fill="#64748b">10 s</text>
    <line x1="806.0" y1="144" x2="806.0" y2="352" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="806.0" y="365" text-anchor="middle" font-size="8.5" font-weight="600" fill="#dc2626">60 s wall</text>
    <text x="472" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a">xor6cut-27</text>
    <text x="472" y="175" font-size="8.2" fill="#64748b">24,786v · 221.7k c</text>
