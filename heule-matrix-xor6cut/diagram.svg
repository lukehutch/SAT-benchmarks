    <text x="637.8" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.8" font-weight="700" fill="#059669">1.09 s</text>
    <text x="558" y="177" font-size="8.1" fill="#475569">CaDiCaL 1.09 s · Kissat 2.14 s · Frob 5.02 s</text>
    <text x="472" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a">xor6cut-26</text>
    <text x="472" y="209" font-size="8.2" fill="#64748b">23,301v · 215.9k c</text>
    <rect x="558" y="186" width="178.3" height="15" rx="3" fill="#10b981"/>
    <text x="742.3" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.8" font-weight="700" fill="#10b981">12.08 s</text>
    <text x="558" y="211" font-size="8.1" fill="#475569">CaDiCaL 12.1 s · CMS 16.2 s · Frob 38.0 s</text>
    <text x="472" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a">xor6cut-25</text>
    <text x="472" y="243" font-size="8.2" fill="#64748b">22,545v · 201.3k c</text>
    <rect x="558" y="220" width="230.2" height="15" rx="3" fill="#d97706"/>
    <text x="782.2" y="231" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" font-weight="700" fill="#ffffff">39.85 s</text>
    <text x="558" y="245" font-size="8.1" fill="#475569">Kissat 39.9 s · CMS-XCNF 40.5 s</text>
    <text x="472" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a">xor6cut-24</text>
    <text x="472" y="277" font-size="8.2" fill="#64748b">21,789v · 192.5k c</text>
    <rect x="558" y="254" width="248.0" height="15" rx="3" fill="#ea580c" fill-opacity="0.18" stroke="#ea580c" stroke-width="1.1" stroke-dasharray="4,2"/>
    <text x="682.0" y="264.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#ea580c">TIMEOUT (&gt;60 s) — SAT (hard)</text>
    <text x="558" y="279" font-size="8.1" fill="#475569">&gt;60 s across all 6 single-core solvers</text>
    <text x="472" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a">xor6cut-23</text>
    <text x="472" y="311" font-size="8.2" fill="#64748b">21,033v · 186.7k c</text>
    <rect x="558" y="288" width="248.0" height="15" rx="3" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.1" stroke-dasharray="4,2"/>
    <text x="682.0" y="298.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#dc2626">TIMEOUT (&gt;60 s) — SAT (Laderman)</text>
    <text x="558" y="313" font-size="8.1" fill="#475569">&gt;60 s across all 6 single-core solvers</text>
    <text x="472" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a">xor6cut-22</text>
    <text x="472" y="345" font-size="8.2" fill="#64748b">19,548v · 180.9k c</text>
    <rect x="558" y="322" width="248.0" height="15" rx="3" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="4,2"/>
    <text x="682.0" y="332.5" text-anchor="middle" font-size="8.6" font-weight="700" fill="#7c3aed">TIMEOUT (&gt;60 s) — OPEN FRONTIER</text>
    <text x="558" y="347" font-size="8.1" fill="#475569">&gt;60 s — famous open algebraic problem!</text>
    <rect x="462" y="382" width="422" height="68" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="472" y="400" font-size="10.2" font-weight="700" fill="#1d4ed8">Why This Sweep Is a Gold-Standard Algebraic Complexity Ladder:</text>
    <text x="472" y="416" font-size="9.2" fill="#334155">• Fewer variables as R drops (24.8k → 19.5k), yet difficulty explodes ~10× per step!</text>
    <text x="472" y="431" font-size="9.2" fill="#334155">• R = 27→25 track CDCL &amp; Gaussian-XOR solver progress (Kissat 3/6, CMS-XCNF 3/6).</text>
    <text x="472" y="444" font-size="9.1" fill="#64748b">• R = 24, 23 (SAT) and R = 22 (open) remain unsolved at T_max = 60 s (1 core).</text>
