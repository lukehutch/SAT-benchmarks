  <rect x="422" y="285" width="500" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="434" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8" font-weight="700" fill="#166534">c0 = -p1 - p3 + p5   |   c1 = -p2 + p4 + p5   |   c2 = p1 + p2 - p5</text>
  <text x="434" y="317" font-size="9.1" fill="#15803d">All coefficients in &#x007B;&#x2212;1, 0, +1&#x007D;: reduces to a valid rank-5 witness mod m for every m &#x2265; 2 (6 naive products &#x2192; 5).</text>
  <rect x="24" y="352" width="912" height="134" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38" y="373" font-size="11.8" font-weight="700" fill="#0f172a">3. Four Exact Optimality Brackets (K = 4 UNSAT vs K = 5 SAT) Scaling Across Ring Modulus m &#x2208; &#x007B;2, 3, 4, 5&#x007D;</text>
  <rect x="38" y="386" width="212" height="84" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
