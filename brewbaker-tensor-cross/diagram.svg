  <text x="144.0" y="437" text-anchor="middle" font-size="8.8" fill="#334155">81-108 native XORs in XCNF</text>
  <text x="144.0" y="454" text-anchor="middle" font-size="8.4" fill="#475569">-1 == +1 (symmetric 0-diag); Chad's pair</text>
