  <rect x="38" y="238" width="342" height="86" rx="7" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="50" y="257" font-size="10.4" font-weight="700" fill="#5b21b6">Why Bilinear Rank Is Always &#x2265; 5 (Every Field)</text>
  <text x="50" y="274" font-size="9.3" fill="#334155">&#x2022; span(S0, S1, S2) = so(3) has dim 3, and every nonzero matrix</text>
  <text x="58" y="288" font-size="9.3" fill="#334155">in so(3) has rank 2 (contains zero rank-1 outer products).</text>
  <text x="50" y="303" font-size="9.3" fill="#334155">&#x2022; Hence 4 rank-1 terms cannot span so(3): K = 4 is UNSAT over</text>
  <text x="58" y="317" font-size="9.3" fill="#334155">every field &#x1D53D;&#x209A; and every quotient ring &#x2124;/m&#x2124; (m &#x2265; 2).</text>
  <rect x="408" y="78" width="528" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="408" y="78" width="528" height="28" rx="10" fill="#0f766e"/>
  <rect x="408" y="94" width="528" height="12" fill="#0f766e"/>
  <text x="422" y="97" font-size="11.6" font-weight="700" fill="#ffffff">2. Verified Universal Rank-5 Identity Over &#x2124; (27/27 Tensor Entries Exact)</text>
  <text x="424" y="126" font-size="10" font-weight="700" fill="#334155">Term</text>
  <text x="476" y="126" font-size="10" font-weight="700" fill="#1d4ed8">Left U[t]&#x00B7;x</text>
  <text x="578" y="126" font-size="10" font-weight="700" fill="#0f766e">Right V[t]&#x00B7;y</text>
  <text x="682" y="126" font-size="10" font-weight="700" fill="#6d28d9">Expanded Product</text>
  <text x="830" y="126" font-size="10" font-weight="700" fill="#b45309">Contributes To</text>
