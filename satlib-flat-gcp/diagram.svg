  <text x="578" y="104" class="h3">Culberson "Flat" Construction</text>
  <text x="578" y="125" class="body">1. Partition V into 3 equal independent sets</text>
  <text x="590" y="142" class="body">   (|C₁| = 11, |C₂| = 10, |C₃| = 9 vertices).</text>
  <text x="578" y="162" class="body">2. Add cross-class edges while flattening</text>
  <text x="590" y="179" class="body">   vertex degrees (deg ∈ [1, 6]) to hide the</text>
  <text x="590" y="196" class="body">   planted 3-coloring from degree heuristics.</text>
  <rect x="562" y="218" width="334" height="134" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="578" y="242" class="h3">Direct 3-Color CNF Encoding (edge2cnf)</text>
  <text x="578" y="264" class="body">Variables: xᵥ,c ∈ {0,1} for v ∈ 1..30, c ∈ {1,2,3}</text>
  <text x="578" y="286" class="mono">ALO:  (xᵥ,₁ ∨ xᵥ,₂ ∨ xᵥ,₃)</text>
  <text x="578" y="305" class="mono">AMO:  (¬xᵥ,a ∨ ¬xᵥ,b)   ∀a &lt; b</text>
  <text x="578" y="324" class="mono">Edge: (¬xᵤ,c ∨ ¬xᵥ,c)   ∀{u,v} ∈ E, c</text>
  <text x="578" y="343" class="body">flat30-1: 90 vars, 300 clauses → flat200: 600 vars</text>
