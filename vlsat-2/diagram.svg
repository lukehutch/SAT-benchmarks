  </defs>
  <rect x="2" y="2" width="936" height="476" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="26" y="34" class="title">VLSAT-2 — Nested-Unit Petri Net (NUPN) Decomposition to SAT</text>
  <text x="26" y="54" class="sub">INRIA / CADP benchmarks: partition concurrent Petri-net places into nested 1-safe sequential units via graph coloring / clique SAT</text>
  <line x1="24" y1="66" x2="916" y2="66" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="80" width="340" height="314" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="40" y="103" class="h3">1. Nested-Unit Petri Net (NUPN)</text>
  <rect x="38" y="114" width="312" height="240" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="48" y="131" class="unit" fill="#475569">Root Unit U₀ (concurrent composition U₁ ∥ U₂)</text>
  <rect x="50" y="142" width="128" height="196" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="159" class="unit" fill="#1d4ed8">Unit U₁ (≤1 token)</text>
  <rect x="208" y="142" width="130" height="196" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="218" y="159" class="unit" fill="#047857">Unit U₂ (≤1 token)</text>
  <line x1="114" y1="206" x2="114" y2="218" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="106" y1="238" x2="88" y2="251" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="122" y1="238" x2="140" y2="251" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="273" y1="206" x2="273" y2="218" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="265" y1="238" x2="247" y2="251" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="281" y1="238" x2="299" y2="251" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="157" y1="278" x2="182" y2="292" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="230" y1="278" x2="204" y2="292" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="114" cy="190" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
