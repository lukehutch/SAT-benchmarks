      .tr { font: 700 9.5px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #ffffff; }
      .unit { font: 700 11px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
