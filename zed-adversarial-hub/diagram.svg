    <text x="26" y="34" font-size="17.5" font-weight="700" fill="#0f172a">Adversarial Bit-Vector Hub Disjunction Circuits (zed-adversarial-hub)</text>
    <text x="26" y="53" font-size="11.8" fill="#475569">6 native AIGER 1.9 high-fanout soundness-audit circuits (hub_20..80) · 10-bit shared hub h coupled to n two′s-complement adder gadgets</text>
    <rect x="782" y="18" width="134" height="24" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="849" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">1 SAT · 5 UNSAT</text>
