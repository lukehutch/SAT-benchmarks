    <rect x="24" y="78" width="456" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="40" y="100" font-size="13" font-weight="700" fill="#0f172a">1. Star-Topology Bit-Blasted Hub AIG (src/main.rs)</text>
    <text x="40" y="116" font-size="10.4" fill="#475569">Single 10-bit hub h fans out across n ∈ {20, 24, 30, 60, 80} satellite adders</text>
    <rect x="38" y="192" width="138" height="126" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <text x="107.0" y="213" text-anchor="middle" font-size="11.2" font-weight="700" fill="#b45309">Shared Hub h</text>
    <text x="107.0" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#0f172a">h[0..9] (10-bit)</text>
    <rect x="50" y="240" width="114" height="24" rx="5" fill="#ffffff" stroke="#fbbf24" stroke-width="1"/>
    <text x="107.0" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#92400e">low ≤ h ≤ 63</text>
    <text x="107.0" y="281" text-anchor="middle" font-size="8.6" fill="#475569">2′s-comp bounds:</text>
    <text x="107.0" y="295" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.7" fill="#475569">¬msb(h−low) ∧ ¬msb(63−h)</text>
    <text x="107.0" y="311" text-anchor="middle" font-size="8.6" font-weight="700" fill="#d97706">Deg CV: 1.16 → 2.31</text>
    <rect x="214" y="130" width="250" height="168" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="224" y="148" font-size="10.4" font-weight="700" fill="#1d4ed8">Satellite Gadget i = 0 (Critical Witness)</text>
    <text x="224" y="163" font-size="9" fill="#475569">Private 10-bit inputs: x₀ ∈ [20, 63],  y₀ ∈ [0, 40]</text>
    <rect x="224" y="172" width="230" height="36" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="232" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.1" font-weight="700" fill="#1e3a8a">pᵢ = −xᵢ − 2h + 40 + (i mod 7)</text>
    <text x="232" y="201" font-size="8.6" fill="#475569">10-bit shift + ripple full-adders → sign ¬pᵢ[9]</text>
    <rect x="224" y="214" width="230" height="36" rx="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="232" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.1" font-weight="700" fill="#5b21b6">rᵢ = yᵢ − h − 10 + (i mod 5)</text>
    <text x="232" y="243" font-size="8.6" fill="#475569">10-bit 2′s-comp subtractor → sign ¬rᵢ[9]</text>
    <rect x="240" y="258" width="198" height="28" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.1"/>
