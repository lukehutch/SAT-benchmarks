    <text x="52" y="411" font-size="10.8" font-weight="700" fill="#0f172a">Bounded Model Checking Formula Φ<tspan baseline-shift="sub" font-size="72%">k</tspan> (Biere et al. 1999; Shtrichman CAV 2000):</text>
