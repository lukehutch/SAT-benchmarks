<text x="309.0" y="381" text-anchor="middle" font-size="9.2" fill="#334155">2d−1 = 39 odd blocks + 1 twisted block (¬x₃₈ ⊕ x₃₉ ⊕ x₄₀ = 1) → odd total parity!</text>
