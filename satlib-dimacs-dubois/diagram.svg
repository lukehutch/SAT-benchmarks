<text x="309.0" y="138" text-anchor="middle" font-size="9.2" font-weight="600" fill="#475569">Exact dubois20 indexing (d = 20, n = 60 vars, 40 3-XOR blocks): top leg x₁..x₁₉, bottom leg x₂₀..x₃₈</text>
<rect x="38" y="342" width="542" height="52" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.15"/>
