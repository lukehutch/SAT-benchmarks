<text x="876" y="154.5" text-anchor="end" font-size="8.5" font-weight="600" fill="#059669">Horn (1 pos)</text>
<rect x="622" y="164" width="262" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="0.9"/>
<text x="632" y="176.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a">(  a ∨ ¬b ∨ ¬c )</text>
<text x="876" y="176.5" text-anchor="end" font-size="8.5" font-weight="600" fill="#059669">Horn (1 pos)</text>
<rect x="622" y="186" width="262" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="0.9"/>
<text x="632" y="198.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#0f172a">( ¬a ∨  b ∨ ¬c )</text>
<text x="876" y="198.5" text-anchor="end" font-size="8.5" font-weight="600" fill="#059669">Horn (1 pos)</text>
<text x="622" y="222" font-size="8.8" fill="#475569">Every normal block has 75% Horn clauses (overall 74%</text>
<text x="622" y="233" font-size="8.8" fill="#475569">with the final negated twist block x₃₈ → ¬x₃₈).</text>
